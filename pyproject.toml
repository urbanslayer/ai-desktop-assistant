[project]
name = "riko-project"
version = "1.0.0"
description = "Push-to-talk anime voice companion: Whisper -> GPT -> GPT-SoVITS / Fish Audio -> VRM avatar."
requires-python = ">=3.11"
dependencies = [
    "av<19",  # av 19 (Sep 2026) breaks faster-whisper 1.2.1 audio loading
    "faster-whisper",
    # hub in local mode runs inside this app (hub/server.py is FastAPI)
    "fastapi",
    "numpy",
    "openai",
    "pyside6>=6.12.0",
    "python-dotenv",
    "python-multipart",
    "pyyaml",
    "requests",
    "sounddevice",
    "soundfile",
    "uvicorn",
    "websockets>=17.4",
    # MCP client for hub local mode (docs/ROUNDS.md R2-M). Same constraint as
    # hub/pyproject.toml; the hub imports it lazily, so local mode without it
    # still boots — MCP just reports "unavailable".
    "mcp",
    # MPRIS2 export for desktop media widgets (riko/music/mpris.py): pure
    # Python, zero-dep D-Bus client with EXPLICIT variant typing. PySide6
    # QtDBus can't express the spec's a{sv} members (int64 mpris:length,
    # object-path mpris:trackid): QDBusAbstractAdaptor needs Q_CLASSINFO
    # which PySide6 doesn't expose, and a{sv} values marshal as the
    # narrowest Python int (small lengths leave as int32, spec says `x`).
    "jeepney>=0.9.0",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: starts server/asr_server.py as a subprocess (skippable with -m 'not slow')",
]
