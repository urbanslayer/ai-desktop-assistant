[project]
name = "riko-project"
version = "1.0.0"
description = "Push-to-talk anime voice companion: Whisper -> GPT -> GPT-SoVITS / Fish Audio -> VRM avatar."
requires-python = ">=3.11"
dependencies = [
    "av<19",  # av 19 (Sep 2026) breaks faster-whisper 1.2.1 audio loading
    "faster-whisper",
    # hub in local mode runs inside this app (hub/server.py is FastAPI)
    "fastapi",
    "numpy",
    "openai",
    "pyside6>=6.12.0",
    "python-dotenv",
    "python-multipart",
    "pyyaml",
    "requests",
    "sounddevice",
    "soundfile",
    "uvicorn",
    "websockets>=17.4",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: starts server/asr_server.py as a subprocess (skippable with -m 'not slow')",
]
