# Riko on Hyprland (classic hyprland.conf syntax, 0.53+ rule blocks).
# Add to your config:   source = /path/to/riko_project/desktop/hyprland/riko.conf
# and change RIKO below to where the project lives.

$RIKO = ~/Development/riko_project

windowrule {
  name = riko-avatar
  match:class = ^(riko)$
  float = on
  pin = on            # on every workspace
  border_size = 0
  no_shadow = on
  no_blur = on
  rounding = 0
  no_anim = on
  size = 420 680
  move = (monitor_w-440) (monitor_h-700)   # bottom-right corner
}

# Global shortcuts (stay off the Super key — that's yours for the WM. These are suggestions:
# check `hyprctl binds` for clashes and pick other keys if needed.)
bind  = CTRL ALT, T, exec, $RIKO/bin/riko-ctl type             # type to her
bind  = CTRL ALT, SPACE, exec, $RIKO/bin/riko-ctl talk-start   # hold to talk...
bindr = CTRL ALT, SPACE, exec, $RIKO/bin/riko-ctl talk-stop    # ...release to send
bind  = CTRL ALT, H, exec, $RIKO/bin/riko-ctl toggle           # show / hide her
bind  = CTRL ALT, P, exec, $RIKO/bin/riko-ctl persona-next     # next persona (cycles)
