# What the local app (desktop.py / main.py) needs to know: where the hub is,
# and how THIS PC's ears and voice work. Her personality, personas, avatars
# and chat history live on the hub now — edit them on the hub's web page
# (http://<hub box>:8002). API keys go in .env (see .env.example).

# ── The hub: her brain, memory and personas ──────────────────
hub:
  mode: remote                     # local = run the hub inside this app (needs the
                                   # hub/ folder in this repo); remote = talk to hub.url
  url: http://192.0.2.51:8002    # remote only: the box running the hub
                                   # (Docker on the AI box: ~/AI/Docker/riko-hub)
  api_key_env: RIKO_HUB_KEY        # .env variable holding the hub key (both modes;
                                   # same value as the hub server's own RIKO_HUB_KEY)
  local_port: 8002                 # local only; binds 127.0.0.1
  local_data: hub_data             # local only; her data folder, relative to this file

# ── Her brain: LOCAL MODE ONLY ───────────────────────────────
# These seed the hub the first time it starts on an empty hub_data folder.
# After that the hub remembers its own settings: change the brain on the
# hub's web page, not here. In remote mode this whole block is ignored.
llm:
  base_url: http://192.0.2.51:8000/v1
  api_key_env: LLM_API_KEY   # name of the .env variable holding the key; leave it unset if the server needs none
  model: auto                # "auto" = the first model the server lists at /v1/models
  temperature: 0.8
  max_tokens: 4096           # reasoning models spend tokens on hidden thinking BEFORE they
                             # answer: 1024 is often all thinking and no reply, and she goes
                             # silent. Leave headroom (the hub retries once at 2x on a
                             # thinking-truncated empty reply, capped at 16384).
  max_history: 40            # past messages sent each turn (the hub keeps everything)
  # Optional knobs for reasoning models (uncomment for your server):
  # reasoning_effort: low    # OpenAI param some servers honour (o-series, vLLM): less time
                             # spent thinking, more budget left for the actual answer
  # extra_body:              # vendor-specific fields passed through in the request body,
                             # e.g. switch thinking off entirely on Qwen (vLLM/llama.cpp):
  #   chat_template_kwargs: {enable_thinking: false}

# ── Her ears (speech to text) ────────────────────────────────
# remote = Faster-Whisper on another machine (run server/asr_server.py there).
#          The mic stays on this PC; only the recorded clip is sent over.
# local  = Faster-Whisper on this PC
# groq   = Groq's online Whisper, needs GROQ_API_KEY in .env
asr: remote

remote_asr:
  url: http://192.0.2.51:8001/v1   # server/asr_server.py, or any OpenAI-compatible STT server (e.g. speaches)
  api_key_env: ASR_API_KEY           # only needed if the server was started with ASR_API_KEY set
  model: large-v3-turbo              # asr_server.py ignores this and uses the model it was started with
  language: en                       # "" = auto-detect

local_asr:
  model: base.en     # bigger = more accurate, slower: small.en, medium.en, large-v3-turbo
  device: cpu        # "cuda" for an NVIDIA GPU (needs CUDA + cuDNN)

# ── Her voice (text to speech) ───────────────────────────────
# hub    = DEFAULT: the HUB makes the audio (Breeze-TTS-2, a per-persona
#          voice designed or cloned on the hub's web page). This PC just
#          downloads the WAV the hub hands back and plays it — no TTS setup
#          or keys here. Needs a hub with TTS configured (see README and
#          tts/); Breeze speaks English and Chinese only. If the hub's TTS
#          is off or unreachable, her reply shows in the bubble only.
# The rest are TTS on THIS PC (the hub's per-persona voice is ignored;
# with tts: openai the persona's tts_voice name picks the voice when set):
# none   = no voice; her reply shows in a speech bubble only
# openai = any OpenAI-compatible /audio/speech server on this PC/LAN
#          (Kokoro-FastAPI, speaches, ...)
# sovits = GPT-SoVITS (start its API server first)
# fish   = Fish Audio, online, needs FISH_API_KEY in .env
tts: hub

openai_tts:
  url: http://192.0.2.51:8880/v1
  api_key_env: TTS_API_KEY
  model: kokoro
  voice: af_heart

sovits:
  url: http://127.0.0.1:9880/tts
  ref_audio_path: character_files/main_sample.wav  # 3-10 s clip of the voice to copy, no long silences
  prompt_text: This is a sample voice for you to just get started with, you can replace this with your own voice samples, just make sure it doesn't have any long silences!
  text_lang: en
  prompt_lang: en

fish:
  # The voice she always uses. Open any voice on fish.audio and copy the ID
  # from its page address (fish.audio/m/<voice id>). This one is an e-girl voice.
  voice_id: 98655a12fa944e26b274c535e5e03842
  model: s2.1-pro

# ── Desktop app (uv run desktop.py) ──────────────────────────
desktop:
  width: 420           # window size in pixels; everything around her is see-through
  height: 680
  bubble_seconds: 8    # how long her speech bubble stays after she finishes
  greet_on_start: true # when the app starts and the avatar page is ready she
                       # says the active persona's greeting (bubble + her voice,
                       # riding her startup wave). false = stay quiet until you
                       # talk to her.

  # The client-tool channel (docs/API.md "client tools"): she registers this PC
  # with the hub and runs what the model asks — open_url, clipboard_read,
  # clipboard_write, notify, and the browser_* tools relayed to the Riko Helper
  # Firefox extension (browser-ext/, see README "🌐 Her hands: client tools").
  client:
    enabled: true
    # id: my-desktop       # hub-side identity; default is <user>-desktop, remembered
                           # in ~/.config/riko/client_id (keep it ^[A-Za-z0-9_-]{1,64}$)
    name: Riko desktop     # what shows in GET /api/clients
    browser_port: 8766     # ws://127.0.0.1:<port> the Firefox extension pairs with
                           # (token: riko-ctl browser-token, or the tray menu)
    approval_timeout: 120  # seconds to wait for Enter/Esc/riko-ctl approve; timeout = deny

  # Keyboard shortcuts. They are app-specific: they only fire while her window
  # is focused, so they never fight your window manager — and NEVER use the
  # Super/Meta/Win key (it is rejected at startup). Format: optional Ctrl/Alt/
  # Shift modifiers + one key name matching KeyboardEvent.key (letters are
  # case-insensitive; Space, Enter, Escape, Backspace, Tab, F1..F12, "/").
  # A list means "any of these"; "" or [] turns the action off. Anything
  # invalid is reported in the terminal at startup and ignored.
  shortcuts:
    type: ["Enter", "/"]            # open the text box
    talk: "Space"                   # hold to talk, release to send
    wave: "W"                       # she waves at you
    persona_next: "P"               # switch to the next persona
    hide: "H"                       # hide her (the tray icon brings her back)
    forget: "Ctrl+Shift+Backspace"  # forget the chat (press again within 3 s to confirm)
    quit: "Ctrl+Q"                  # quit (also in the tray menu)
