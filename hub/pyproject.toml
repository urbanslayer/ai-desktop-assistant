[project]
name = "riko-hub"
version = "1.0.0"
description = "Riko hub: one small FastAPI server for personas, chat memory and LLM settings, shared by every Riko client."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "openai",
    "requests",
    "soundfile",
    "numpy",
    # MCP client (docs/ROUNDS.md R2-M). The hub imports it lazily, so local
    # mode without it still boots — MCP just reports "unavailable".
    "mcp",
]

[tool.uv]
package = false
