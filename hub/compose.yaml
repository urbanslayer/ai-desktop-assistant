# Riko hub on the AI box:  docker compose up -d   (see README.md / .env.example)
services:
  hub:
    build: ./
    image: riko-hub
    ports:
      - "${RIKO_HUB_PORT:-8002}:8002"
    environment:
      # server.py reads these; keep them in sync with .env.example and
      # tests/test_hub_packaging.py (it fails the build on a missing one).
      # owner's wall-clock zone for timers + spoken times (docs/TIMERS.md H);
      # the settings page `timezone` field overrides this per deployment
      TZ: "${TZ:-Europe/London}"
      RIKO_HUB_KEY: "${RIKO_HUB_KEY:-}"
      # in-container listen address/data dir; the host port mapping is the
      # `ports:` entry above (RIKO_HUB_PORT in .env only moves the host port).
      RIKO_HUB_DATA: "${RIKO_HUB_DATA:-/data}"
      RIKO_HUB_HOST: "${RIKO_HUB_HOST:-0.0.0.0}"
      RIKO_HUB_PORT: "8002"
      RIKO_LLM_BASE_URL: "${RIKO_LLM_BASE_URL:-}"
      RIKO_LLM_API_KEY: "${RIKO_LLM_API_KEY:-}"
      RIKO_LLM_MODEL: "${RIKO_LLM_MODEL:-auto}"
      # Breeze-TTS-2 voice (docs/VOICE.md). The hub is the ONLY component that
      # talks to breeze; clients just fetch the audio_url paths it returns.
      # Empty RIKO_TTS_BASE_URL = voice off (audio_url stays null everywhere).
      RIKO_TTS_BASE_URL: "${RIKO_TTS_BASE_URL:-http://breeze-tts:8137}"
      RIKO_TTS_ENABLED: "${RIKO_TTS_ENABLED:-1}"
      # Built-in web tools (docs/API.md). Empty RIKO_SEARXNG_URL = web_search
      # off (the tool stays listed but reports unavailable). Point it at a
      # SearXNG instance, e.g. http://192.0.2.101:8989 or a `riko`-network
      # service name. RIKO_ALLOW_PRIVATE_FETCH=1 lets fetch_page follow URLs
      # to private/loopback addresses (SSRF guard off; trusted LAN only).
      RIKO_SEARXNG_URL: "${RIKO_SEARXNG_URL:-}"
      RIKO_ALLOW_PRIVATE_FETCH: "${RIKO_ALLOW_PRIVATE_FETCH:-0}"
      # Spotify (docs/SPOTIFY_NOTES.md, docs/API.md "Spotify"): leave these
      # empty for the real Spotify hosts; only tests point them at the in-repo
      # fake server. The client id lives in hub settings (web page), never
      # in env; tokens live in the hub store and never leave it.
      RIKO_SPOTIFY_ACCOUNTS_URL: "${RIKO_SPOTIFY_ACCOUNTS_URL:-}"
      RIKO_SPOTIFY_API_URL: "${RIKO_SPOTIFY_API_URL:-}"
      # Weather (docs/API.md "Weather"): the weather tool needs no key (it
      # calls Open-Meteo directly). RIKO_LOCATION is a default home place
      # (e.g. "Gloucester, UK") until the owner picks one on the Settings
      # page; RIKO_UNITS picks the weather unit preset: auto | metric |
      # uk (°C, mph) | us (°F, mph, in); legacy imperial = us.
      RIKO_LOCATION: "${RIKO_LOCATION:-}"
      RIKO_UNITS: "${RIKO_UNITS:-auto}"
      # Home Assistant (README "Home Assistant"): RIKO_HA_URL is the HA base
      # URL, RIKO_HA_TOKEN the long-lived access token. Both set = the hub
      # offers the built-in 'homeassistant' MCP server (…/api/mcp/assist).
      # The token never enters the database: the server config only carries
      # the ${RIKO_HA_TOKEN} placeholder, expanded at connect time.
      RIKO_HA_URL: "${RIKO_HA_URL:-}"
      RIKO_HA_TOKEN: "${RIKO_HA_TOKEN:-}"
      # timer scheduler poll interval in seconds (docs/TIMERS.md H, floor 1)
      RIKO_TIMER_POLL_S: "${RIKO_TIMER_POLL_S:-1}"
    volumes:
      # hub.db + avatars live here on the host; back this folder up to move her brain
      - ./data:/data
    user: "${UID:-1000}:${GID:-1000}"  # keep ./data owned by your host user
    networks:
      - default
      # shared with the breeze-tts compose stack (`docker network create riko`
      # once on the host, see README.md). hub keeps its old default-network
      # address; clients keep talking only to the hub.
      - riko
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

networks:
  default: {}
  riko:
    external: true
