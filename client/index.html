<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Riko</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; font: 15px/1.35 system-ui, sans-serif; }
    html.desktop, body.desktop { background: transparent; }
    canvas { display: block; }
    audio { display: none; }  /* an inline audio element would reserve a strip at the bottom of the page */
    #start {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: #444; background: rgba(255, 255, 255, 0.8); cursor: pointer;
    }

    /* Her speech bubble, at the top so it never covers her face for long */
    #bubble {
      position: fixed; top: 10px; left: 12px; right: 12px; max-height: 32vh; overflow-y: auto;
      padding: 10px 14px; border-radius: 16px; color: #2b2233;
      background: rgba(255, 255, 255, 0.93); box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
      opacity: 0; transform: translateY(-8px); transition: opacity .25s, transform .25s; pointer-events: none;
      scrollbar-width: none;
    }
    #bubble.show { opacity: 1; transform: none; pointer-events: auto; }
    #bubble.error { background: rgba(255, 228, 228, 0.95); color: #7a1c1c; font-size: 13px; }

    /* What she heard you say + what she's doing */
    #hud {
      position: fixed; left: 12px; right: 12px; bottom: 64px; display: flex; flex-direction: column;
      align-items: flex-end; gap: 6px; pointer-events: none;
    }
    #heard, #status {
      max-width: 85%; padding: 5px 11px; border-radius: 12px; font-size: 13px;
      background: rgba(30, 25, 45, 0.78); color: #f3eefc; opacity: 0; transition: opacity .25s;
    }
    #heard.show, #status.show { opacity: 1; }
    #status { align-self: center; }
    /* Roam strip: the bubble and the status pill follow her along the strip
       (the page sets --roam-x to her projected screen offset) */
    html.desktop.roam #bubble {
      left: calc(50% + var(--roam-x, 0px)); right: auto; width: max-content;
      max-width: min(60vw, 560px); transform: translate(-50%, -8px);
    }
    html.desktop.roam #bubble.show { transform: translate(-50%, 0); }
    html.desktop.roam #status { transform: translateX(var(--roam-x, 0px)); }
    #status.listening { background: rgba(200, 40, 70, 0.88); }
    #status.listening::before { content: "● "; animation: blink 1s infinite; }
    /* Approval ask: "Can I …? Enter = yes, Esc = no" (desktop.py, R2-F) */
    #approval {
      max-width: 92%; padding: 7px 13px; border-radius: 12px; font-size: 14px; align-self: center;
      background: rgba(255, 176, 32, 0.94); color: #241a02; opacity: 0; transition: opacity .25s;
    }
    #approval.show { opacity: 1; }
    @keyframes blink { 50% { opacity: .2; } }

    /* Text input: Enter (or the global shortcut) opens it, Esc closes it */
    #input {
      position: fixed; left: 10px; right: 10px; bottom: 12px; display: none;
      padding: 10px 14px; border: 2px solid rgba(140, 100, 220, 0.9); border-radius: 22px; outline: none;
      font: inherit; color: #221a30; background: rgba(255, 255, 255, 0.96); box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
    }
    #input.show { display: block; }
  </style>
  <!-- Vendored libraries (offline: no CDN). See client/vendor/README.md;
       tests/test_client_vendor.py guards versions, hashes and local paths. -->
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/addons/",
        "@pixiv/three-vrm": "./vendor/three-vrm/three-vrm.module.min.js",
        "@pixiv/three-vrm-animation": "./vendor/three-vrm-animation/three-vrm-animation.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="start">Loading...</div>
  <div id="bubble"></div>
  <div id="hud"><div id="heard"></div><div id="approval"></div><div id="status"></div></div>
  <input id="input" type="text" placeholder="Say something to her… (Enter to send, Esc to close)" autocomplete="off">
  <audio id="voice"></audio>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
    import { VRMAnimationLoaderPlugin, createVRMAnimationClip } from '@pixiv/three-vrm-animation';
    import { Director } from './js/director.js';
    import { GESTURES, vowelWeights, IK_ARM_GESTURES } from './js/gestures.js';
    import { gestureEnvelope } from './js/ik.js';
    import { AvatarMotion } from './js/motion.js';
    import {
      hitTest, PressTracker, TouchRecogniser, TouchPostGate, GRABBABLE,
    } from './js/touch.js';
    import { PoseLayer, GRAB_KIND } from './js/pose.js';
    import { WalkDirector } from './js/walk.js';
    import { clampScale, stepScale, dollyDistance, approachScale,
             GestureTracker, framingDistance, feetAnchorTarget,
             sizeChanged, controlsDistanceBand,
             GESTURE_HEADROOM, FOOT_MARGIN_PX, SCALE_MAX } from './js/scale.js';

    // desktop.py opens this page with ?desktop=1: see-through background, no click-to-start,
    // and the whole body in frame. In a normal browser it looks like it always did.
    const DESKTOP = new URLSearchParams(location.search).has('desktop');
    // Headless visual QA hook (?capture=2,10,30): POST a PNG of the canvas to
    // /capture?t=<sec> and the pose metrics (window.rikoMeasure) to
    // /measure?t=<sec> that many seconds after she woke up. Nothing else
    // changes; the harness is client/tools/capture_frames.py.
    const CAPTURE = new URLSearchParams(location.search).get('capture');
    // Headless actions QA (?actionstiming=14): record every gesture start/stop
    // transition (and a marker when a say event carrying actions arrives) into
    // window.__actionTimeline, and POST it to /timeline that many seconds after
    // wake. The harness is client/tools/actions_check.py.
    const TIMING = Number(new URLSearchParams(location.search).get('actionstiming')) || 0;
    // QA hook (?force=think@0,wave@12): silence the director and play the named
    // built-in gesture(s) at the given seconds after she woke up, so poses can
    // be photographed and measured at exact times.
    const FORCE = new URLSearchParams(location.search).get('force');
    // QA hook (?gaze=-25,0): force a gaze offset (degrees yaw,pitch) after
    // attach, so renders can photograph look-left/right/up and big glances.
    const GAZE_PARAM = new URLSearchParams(location.search).get('gaze');
    // QA hook (?roam=1): force roam-strip mode even without desktop settings.
    const ROAM_PARAM = new URLSearchParams(location.search).has('roam');
    // QA hook (?wheelzoom=startMs:count:deltaY:gapMs): fire real WheelEvents
    // at the canvas so a scroll-zoom gesture can be photographed frame by
    // frame (harness: client/tools/capture_frames.py --gestures).
    const WHEEL_ZOOM_QA = new URLSearchParams(location.search).get('wheelzoom');
    // Headless capture with ?desktop=1 fakes the DESKTOP side inside the
    // page: /control/avatar-scale resizes the CANVAS here (window = base x
    // scale, like the real window resize does) instead of being POSTed, so
    // a gesture run exercises the same grow/fit + resize-refit path.
    const FAKE_DESK = DESKTOP && !!CAPTURE;
    let fakeWin = null;   // canvas size while faking a window (null = viewport)
    const viewW = () => (fakeWin ? fakeWin.w : innerWidth);
    const viewH = () => (fakeWin ? fakeWin.h : innerHeight);
    // In ?force= mode the director is silenced: only the forced items move her.
    // Exception: force=walk@N must still flow, or the capture harness could
    // never photograph the gait (it also implies ?roam=1 for the walk director).
    const FORCE_WALK = !!FORCE && FORCE.split(',').some((s) => s.trim().startsWith('walk'));
    if (DESKTOP) {
      // Both elements paint a white background by default; on HTML it is not covered
      // by the body rule, and Qt would happily show that white as an opaque box.
      document.documentElement.classList.add('desktop');
      document.body.classList.add('desktop');
    }
    const settings = await fetch('/settings').then((r) => r.json()).catch(() => ({}));
    const BUBBLE_SECONDS = settings.bubble_seconds ?? 8;
    // Roam: strip (docs/WALK_MEMORY.md W) — desktop.py puts the window as a
    // see-through strip at the bottom of the screen; here she wanders inside
    // it and the desktop shapes the click-through region from our POSTs.
    const ROAM = ROAM_PARAM || FORCE_WALK || (DESKTOP && settings.roam === 'strip');
    if (ROAM) document.documentElement.classList.add('roam');

    // ── Scene ──
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: DESKTOP, preserveDrawingBuffer: !!CAPTURE });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(viewW(), viewH());
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    if (DESKTOP) renderer.setClearColor(0x000000, 0);  // fully transparent around her
    else scene.background = new THREE.Color(0xffffff);
    const camera = new THREE.PerspectiveCamera(30, viewW() / viewH(), 0.1, 20);
    const light = new THREE.DirectionalLight(0xffffff, Math.PI);
    light.position.set(1, 1, 1);
    scene.add(light);
    if (DESKTOP) scene.add(new THREE.AmbientLight(0xffffff, 0.6));  // no white room to bounce off, so lift the shadows

    // The size the renderer + camera are framed for right now. The render
    // loop compares the live canvas size against this EVERY frame (the
    // size-changed rule in scale.js): the frame the canvas changes size
    // must be re-framed for the NEW size BEFORE it renders, so a compositor
    // resize can never paint one frame with stale framing.
    let framedW = viewW(), framedH = viewH();
    // A resize can land while init is still awaiting (local vendor files load
    // fast): the hoisted updateWalkBounds() would then touch `director` in its
    // TDZ. Bounds are recomputed at init anyway, so skip calls until then.
    let walkBoundsReady = false;
    function syncViewport() {
      framedW = viewW(); framedH = viewH();
      camera.aspect = framedW / framedH;
      camera.updateProjectionMatrix();
      renderer.setSize(framedW, framedH);
      if (walkBoundsReady) updateWalkBounds();
      // THE frame the compositor resized us: re-frame so pixels-per-metre
      // and the feet stay exactly where they were (scale.js invariant) —
      // this is what makes the gesture's grow/fit invisible.
      if (DESKTOP && !manualFrame) applyScaleFrame(scaleShown);
    }
    addEventListener('resize', syncViewport);

    // ── Load her ──
    // The avatar is the ACTIVE persona's, served by riko/viewer.py from the hub.
    // On a 'persona' event the page fetches /avatar.vrm?v=<id>-<version> again
    // and swaps the model without reloading (her greeting arrives as a 'say').
    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));
    loader.register((parser) => new VRMAnimationLoaderPlugin(parser));

    // Which persona body the page is showing ('<id>:<avatar_version>'), so
    // duplicated 'persona' events for the same body are ignored. Unknown
    // until the first event (the initial load always serves the active one).
    let attachedKey = null;

    const motion = new AvatarMotion(THREE, { scene, camera });
    let vrm = null;

    async function loadVRM(url) {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error(`avatar ${res.status}`);
      const data = await res.arrayBuffer();
      const gltf = await new Promise((ok, bad) => loader.parse(data, '', ok, bad));
      if (!gltf.userData.vrm) throw new Error('not a VRM file');
      return gltf.userData.vrm;
    }

    // ── Optional VRMA gesture clips: files dropped into client/animations/
    //    (served through /animations.json) replace the built-in gestures. ──
    const vrmas = {};   // gesture name -> parsed VRMAnimation (persona-retargetable)
    const clips = {};   // gesture name -> {clip, loop} for the current persona
    try {
      const listing = await fetch('/animations.json', { cache: 'no-store' }).then((r) => r.json());
      for (const item of listing.animations || []) {
        const res = await fetch(item.url, { cache: 'no-store' });
        if (!res.ok) continue;
        const buf = await res.arrayBuffer();
        const gltf = await new Promise((ok, bad) => loader.parse(buf, '', ok, bad));
        const vrma = gltf.userData.vrmAnimations?.[0];
        if (vrma) vrmas[item.name] = vrma;
      }
    } catch { /* no animations directory, built-in gestures it is */ }

    function rebuildClips() {
      for (const [name, vrma] of Object.entries(vrmas)) {
        clips[name] = { clip: createVRMAnimationClip(vrma, vrm), loop: !!vrma.meta?.loop,
                        tracker: vrma.lookAtTracker || null };
      }
    }

    // ── Body capabilities (docs/BODY.md §1/§5) ──
    // The page owns the real gesture library (built-in poses + .vrma drop-ins),
    // so it teaches the director the drop-ins' timings and reports the whole
    // list to the desktop (POST /control/body-capabilities), which registers
    // it with the hub. Until this arrives, the desktop registers the built-in
    // default list. A plain browser tab has no desktop to tell — POST is
    // fire-and-forget; losing it just keeps the defaults on the hub.
    const BODY_EXPRESSIONS = ['happy', 'angry', 'sad', 'relaxed', 'surprised'];
    function reportBody() {
      const actions = [...new Set([
        ...Object.keys(GESTURES).filter((n) => !n.startsWith('talk_')),  // talk_* are internal
        ...Object.keys(vrmas),
      ])].sort();
      fetch('/control/body-capabilities', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ actions, expressions: BODY_EXPRESSIONS }),
      }).catch(() => {});
    }

    function attach(model) {
      if (vrm) {  // old persona: out of the scene, GPU memory freed
        motion.detach(vrm);
        scene.remove(vrm.scene);
        VRMUtils.deepDispose(vrm.scene);
        vrm.dispose();
      }
      vrm = model;
      VRMUtils.rotateVRM0(vrm);  // older VRM 0.x models face away without this
      scene.add(vrm.scene);

      // Arms down. VRM 0.x models are mirrored on this axis, so the angle flips.
      // (motion.js blends gestures toward this same rest rotation.)
      const arm = vrm.meta.metaVersion === '0' ? -1.3 : 1.3;
      const lUa = vrm.humanoid.getNormalizedBoneNode('leftUpperArm');
      const rUa = vrm.humanoid.getNormalizedBoneNode('rightUpperArm');
      if (lUa) lUa.rotation.z = -arm;
      if (rUa) rUa.rotation.z = arm;
      vrm.scene.updateMatrixWorld(true);

      motion.attach(vrm);   // re-targets bones, gaze, and gestures onto the new body
      pose.attach(vrm);     // the pose layer rides the same bone cache (docs/TOUCH.md)
      resetTouchState();    // persona swap: no dangling grabs/sits on the old bones
      if (GAZE_PARAM) {
        const [gy, gp] = GAZE_PARAM.split(',').map(Number);
        motion.setGazeOverride({ yaw: (gy || 0) * Math.PI / 180,
                                 pitch: (gp || 0) * Math.PI / 180 });
      }
      window.__rikoGaze = (yaw, pitch) => motion.setGazeOverride(
        yaw == null ? null : { yaw, pitch });

      // Gesture-aware framing (see applyFraming below): her whole body and
      // the wave/think envelope fit the window at its current aspect.
      applyFraming();
      if (DESKTOP) applyScaleFrame(scaleShown);  // wear the saved zoom (feet-anchored)
      rebuildClips();
      // reply actions may name .vrma gestures: teach the director their timings
      director.library(Object.fromEntries(Object.entries(clips)
        .map(([n, c]) => [n, { loop: !!c.loop, duration: c.clip.duration }])));
      reportBody();           // tell the desktop what this body can do right now
      resumeLife();           // whatever the director had running, replay on this body
    }

    // ── Camera: drag to rotate, right-drag to move her. In a plain browser
    //    tab scroll zooms the camera like it always did. On the desktop,
    //    scroll sizes HER instead (see the scale block below) and only
    //    Ctrl+scroll keeps the old camera dolly. ──
    const controls = new OrbitControls(camera, renderer.domElement);
    if (DESKTOP) {
      // Roam: the left button drags HER along the strip (page-side handler
      // below), not the window — desktop.py stops intercepting drags then.
      controls.mouseButtons = ROAM
        ? { LEFT: null, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE }
        : { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
    } else {
      controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
    }
    controls.minDistance = 0.5;
    controls.maxDistance = 6;
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;  // lower = longer glide
    addEventListener('contextmenu', (e) => e.preventDefault());

    // ── Gesture-aware framing: fit her whole body AND the wave/think
    //    envelope (raised hand included, measured from THIS rig) inside the
    //    window at its current aspect. This only sets the default view per
    //    persona — window resizes keep the aspect ratio (scroll-to-size
    //    scales width AND height), so the fit-to-body framing is constant
    //    and she is never cropped by a bigger or smaller window. Also the
    //    camera reset the double-click / tray Reset size runs.
    function applyFraming() {
      if (!vrm) return;
      const rig = motion.rig;
      if (rig) {
        const durs = Object.fromEntries(Object.entries(IK_ARM_GESTURES).map(([n, g]) => [n, g.duration]));
        const env = gestureEnvelope(rig, IK_ARM_GESTURES, durs);
        const yTop = Math.max(env.yTop, rig.bboxTop) + 0.03;
        const yBot = Math.min(env.yBottom, rig.bboxBottom) - 0.03;
        const halfFovY = Math.tan((camera.fov * Math.PI) / 360);
        const needH = (yTop - yBot) * 1.06;                    // +6% margin
        const needW = env.xHalf * 2 * 1.06;
        const dist = Math.max(needH / 2 / halfFovY,
                              needW / 2 / (halfFovY * camera.aspect), 0.8);
        // the fit reference for the visual-scale framing (applyScaleFrame):
        // distance that fits her at scale 1.0 in the BASE window, and her
        // feet height in world units. Both are rig constants — window size
        // cancels out, which is exactly what keeps zoom continuous.
        fitMeasure = { dist, yBot };
        // near plane close enough that her raised hand never clips when the
        // camera sits at this distance; far plane keeps room for user zoom-out
        camera.near = Math.max(0.02, Math.min(0.1, dist * 0.01));
        camera.far = Math.max(20, dist * 6);
        camera.position.set(0, (yTop + yBot) / 2, dist);
        controls.target.set(0, (yTop + yBot) / 2, 0);
        camera.updateProjectionMatrix();
        if (director.walk) {   // strip width in metres = the visible canvas
          updateWalkBounds();
          vrm.scene.position.x = director.walk.x;
        }
      } else {  // rig too incomplete to measure: old head-height heuristic
        const headY = vrm.humanoid.getNormalizedBoneNode('head')?.getWorldPosition(new THREE.Vector3())?.y ?? 1.4;
        camera.position.set(0, headY * 0.68, headY * 2.6);
        controls.target.set(0, headY * 0.62, 0);
      }
    }

    // ── Scroll = zoom her (desktop): the PAGE renders the zoom ──────────
    //    Plain wheel over her changes a VISUAL scale (0.4x–2.5x, delta-
    //    continuous: one notch ≈ 8%, small trackpad deltas proportional —
    //    scale.js). The render loop glides scaleShown toward it and
    //    re-frames the camera EVERY FRAME (framingDistance: pixels-per-
    //    metre = visual x the base-window fit rate, feet anchored a fixed
    //    14 px above the window bottom), so she grows/shrinks smoothly
    //    and immediately, no window round trip in the loop.
    //    The real WINDOW moves once per gesture each way: the first wheel
    //    event POSTs a HEADROOM request (window = target x 1.6, feet
    //    anchored, monitor-clamped by the desktop — riko/avatar_scale.py
    //    batches resize+move into ONE hyprctl call); 400 ms after the
    //    wheel stops, a FIT request sizes the window to the final scale
    //    and persists it. Re-framing on the resulting canvas resize
    //    preserves pixels-per-metre and the feet pixel position, so both
    //    window moves are invisible. The desktop answers each POST with
    //    {window, max}: windowScale tracks what the window really is,
    //    pageMax is the monitor-fit ceiling that stops final growth.
    //    Ctrl+scroll keeps the OLD camera dolly (manual framing until a
    //    reset); double-click / tray Reset size restores 1.0 + the fit.
    let scaleTarget = clampScale(settings.avatar_scale);
    let scaleShown = scaleTarget;
    let windowScale = scaleTarget;      // what the desktop window is really at
    let windowAsk = scaleTarget;        // last window scale we POSTed to the desktop
    let pageMax = SCALE_MAX;            // monitor-fit ceiling from the desktop
    let manualFrame = false;            // Ctrl+scroll dolly owns the framing
    let fitMeasure = null;              // {dist, yBot} set by applyFraming
    const baseW = Math.max(1, Math.round(viewW() / scaleTarget));  // window px at scale 1.0
    const baseH = Math.max(1, Math.round(viewH() / scaleTarget));
    const sizeGesture = new GestureTracker();
    function applyScaleFrame(v) {
      // Visual zoom for THIS frame: distance keeps pixels-per-metre at
      // v x (fit rate) regardless of the canvas size, and her feet sit
      // FOOT_MARGIN_PX above the canvas bottom — whose screen point is
      // feet-anchored — so a window resize changes neither.
      if (!vrm || !fitMeasure) return;
      const W = viewW(), H = viewH();
      const dist = framingDistance(fitMeasure.dist, H, baseH, v);
      const yt = feetAnchorTarget(fitMeasure.yBot, dist, camera.fov, H, FOOT_MARGIN_PX);
      // controls.update() clamps the camera radius to its distance band
      // EVERY frame and rewrites camera.position — the stock 0.5..6 cap
      // yanked a headroom window's ~8-unit framing distance back to 6 and
      // cropped her feet for hundreds of ms. Widen the band around OUR
      // distance so the framing we just computed is what renders.
      [controls.minDistance, controls.maxDistance] = controlsDistanceBand(dist);
      camera.near = Math.max(0.02, Math.min(0.1, dist * 0.01));
      camera.far = Math.max(20, dist * 6);
      camera.position.set(0, yt, dist);
      controls.target.set(0, yt, 0);
      camera.aspect = W / H;
      camera.updateProjectionMatrix();
      if (director.walk) {   // strip width in metres = the visible canvas
        updateWalkBounds();
        vrm.scene.position.x = director.walk.x;
      }
    }
    function postScale(value, win, gesture) {
      if (!DESKTOP && !FAKE_DESK) return;
      const v = Math.round(value * 1000) / 1000;
      const w = Math.round(win * 1000) / 1000;
      windowAsk = w;   // gesture bookkeeping compares against what we ASKED
      if (FAKE_DESK) {   // capture harness: the page IS the desktop
        windowScale = w;
        fakeWin = { w: Math.round(baseW * w), h: Math.round(baseH * w) };
        dispatchEvent(new Event('resize'));  // same path a WM resize takes
        return;
      }
      fetch('/control/avatar-scale', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ scale: v, window: w, gesture: !!gesture }),
      }).then((r) => r.json()).then((res) => {
        if (!res) return;
        if (res.ok && Number.isFinite(+res.window)) windowScale = +res.window;
        if (Number.isFinite(+res.max)) pageMax = Math.min(SCALE_MAX, +res.max);
      }).catch(() => {});   // plain browser tab: no desktop to resize
    }
    function resetAvatarSize() {
      sizeGesture.reset();
      manualFrame = false;
      scaleTarget = 1.0;
      scaleShown = 1.0;
      postScale(1.0, 1.0, false);
      applyScaleFrame(1.0);       // undo a Ctrl+scroll close-up too
    }
    if (DESKTOP) {
      controls.enableZoom = false;  // the wheel is ours now; dolly is manual
      renderer.domElement.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (e.ctrlKey) {    // old behaviour: camera dolly, scale untouched
          const d = camera.position.distanceTo(controls.target);
          const nd = dollyDistance(d, e.deltaY, controls.minDistance, controls.maxDistance);
          camera.position.sub(controls.target).setLength(nd).add(controls.target);
          manualFrame = true;
          return;
        }
        manualFrame = false;   // the wheel's zoom framing takes over again
        scaleTarget = Math.min(pageMax, stepScale(scaleTarget, e.deltaY, e.deltaMode));
        const grow = sizeGesture.wheel(performance.now(), scaleTarget, windowAsk);
        if (grow !== null) postScale(scaleTarget, grow, true);
      }, { passive: false });
      renderer.domElement.addEventListener('dblclick', () => resetAvatarSize());
      postScale(scaleTarget, scaleTarget, false);  // make the window match the saved scale
    }

    // ── The director: decides what she does, motion.js does the moving ──
    const T = () => performance.now() / 1000;
    // Roam: strip — the walk schedule lives in walk.js (pure, node-tested);
    // this page feeds it, applies its actions, and owns x persistence.
    const walkOpts = {};
    if (Array.isArray(settings.roam_every) && settings.roam_every.length === 2) {
      walkOpts.every = settings.roam_every.map(Number);
    }
    if (Number.isFinite(+settings.roam_speed)) walkOpts.speedMul = +settings.roam_speed;
    const walkDirector = ROAM ? new WalkDirector(walkOpts) : null;
    const director = new Director({ walk: walkDirector });
    walkBoundsReady = true;
    if (walkDirector && Number.isFinite(+settings.roam_x)) walkDirector.setX(0, +settings.roam_x);
    let faceWant = 0;         // vrm.scene.rotation.y target (face travel direction)
    let lastXSent = null;
    function persistWalkX() {
      if (!director.walk) return;
      lastXSent = director.walk.x;
      fetch('/control/walk-state', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ x: director.walk.x, walking: director.walk.walking }),
      }).catch(() => {});
    }
    // ── Roam-strip page glue: strip bounds in metres, the 10 Hz input-region
    //    POST desktop.py shapes its click-through mask from, bubble follow,
    //    and the left-drag that moves her along the strip ──
    function stripGeometry() {
      const halfFovY = Math.tan((camera.fov * Math.PI) / 360);
      const dist = Math.max(0.3, camera.position.distanceTo(controls.target));
      const halfW = halfFovY * dist * camera.aspect;   // visible world half-width at her depth
      return { halfW, mPerPx: (2 * halfW) / Math.max(1, innerWidth) };
    }
    function updateWalkBounds() {
      const w = director?.walk;
      if (!w || !vrm) return;
      const rig = motion.rig;
      if (!rig) return;
      const { halfW, mPerPx } = stripGeometry();
      // desktop.roam_margin px kept clear at each screen edge, plus her body
      const margin = ((+settings.roam_margin || 40) * mPerPx) + rig.shoulderWidth / 2 + 0.1;
      const lim = Math.max(0.2, halfW - margin);
      w.configure({ bounds: { min: -lim, max: lim }, height: rig.height });
    }
    // ── Touch & posing (docs/TOUCH.md) ─────────────────────────────────
    // The pose layer (limb-grab IK + sit pose, client/js/pose.js) rides on top
    // of the life layer every frame; pointer presses are classified by the
    // pure recogniser (client/js/touch.js) into window-drag / grab / tap /
    // stroke -> pat / poke / tickle. The page reacts locally (expression +
    // small move) and posts /control/touch (debounced) for the hub.
    const pose = new PoseLayer(THREE, motion);
    let touchMode = 'quiet';        // off | quiet | chatty (desktop touch-mode:<m>)
    let sitReported = null;         // last /control/sit-state value posted
    let touchBlocked = false;       // walk 'touch' block currently held
    let grabId = null, grabDepth = null, grabDownAt = 0;
    let _touchPress = new PressTracker();
    let _touchRec = new TouchRecogniser();
    const _touchGate = new TouchPostGate();
    const _lastPt = { x: 0, y: 0 };
    const _tp = new THREE.Vector3();
    const PART_BONE = {
      hand_l: 'leftHand', hand_r: 'rightHand',
      arm_l: 'leftLowerArm', arm_r: 'rightLowerArm',
      foot_l: 'leftFoot', foot_r: 'rightFoot', head: 'head',
    };
    function resetTouchState() {   // persona swap: the old bones are gone
      _touchPress = new PressTracker();
      _touchRec = new TouchRecogniser();
      grabId = null; grabDepth = null; sitReported = null; touchBlocked = false;
    }

    // ── body-part screen rects (the bbox seam, docs/TOUCH.md §parts) ──
    // Window CSS px, projected from the LIVE bones so they track sit/grab/roam
    // exactly; ~6 px padded like the bbox itself.
    function _pxOf(p) {
      _tp.set(p[0], p[1], p[2]).project(camera);
      return [(_tp.x * 0.5 + 0.5) * innerWidth, (-_tp.y * 0.5 + 0.5) * innerHeight];
    }
    function _rectOf(pts, pad) {
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity, ok = false;
      for (const p of pts) {
        const [px, py] = _pxOf(p);
        if (!Number.isFinite(px) || !Number.isFinite(py)) continue;
        ok = true;
        x0 = Math.min(x0, px); x1 = Math.max(x1, px);
        y0 = Math.min(y0, py); y1 = Math.max(y1, py);
      }
      if (!ok) return null;
      return [Math.round(x0 - pad), Math.round(y0 - pad),
              Math.round(x1 - x0 + pad * 2), Math.round(y1 - y0 + pad * 2)];
    }
    function _boxAround(p, s, ys = s) {
      const pts = [];
      for (const dx of [-s, s]) for (const dy of [-ys, ys]) for (const dz of [-s, s]) {
        pts.push([p.x + dx, p.y + dy, p.z + dz]);
      }
      return pts;
    }
    function computeParts() {
      if (!vrm || !motion.rig) return null;
      const bone = (b) => vrm.humanoid.getNormalizedBoneNode(b);
      const wp = (b) => b ? b.getWorldPosition(new THREE.Vector3()) : null;
      const rig = motion.rig;
      const parts = {};
      const head = bone('head');
      if (head) parts.head = _rectOf(_boxAround(wp(head), (rig.headLen || 0.12) * 0.55), 6);
      for (const [S, s] of [['l', 'left'], ['r', 'right']]) {
        const hand = wp(bone(`${s}Hand`)), elb = wp(bone(`${s}LowerArm`)), foot = wp(bone(`${s}Foot`));
        if (hand) parts[`hand_${S}`] = _rectOf(_boxAround(hand, 0.055), 6);
        if (elb && hand) parts[`arm_${S}`] = _rectOf(
          _boxAround(elb, 0.05).concat(_boxAround(hand, 0.05)), 6);
        if (foot) parts[`foot_${S}`] = _rectOf(_boxAround(foot, 0.07, 0.05), 6);
      }
      const hips = bone('hips'), chest = bone('chest') || bone('upperChest') || bone('spine');
      const hipsW = wp(hips), chestW = wp(chest);
      const half = (rig.shoulderWidth || 0.3) * 0.5;
      if (hipsW && chestW) parts.torso = _rectOf(
        _boxAround([hipsW.x, (hipsW.y + chestW.y) / 2, hipsW.z], half * 0.85, (chestW.y - hipsW.y) / 2 + 0.05), 6);
      if (hipsW) parts.hips = _rectOf(_boxAround(hipsW, half * 0.8, 0.09), 6);
      for (const k of Object.keys(parts)) if (!parts[k]) delete parts[k];
      return parts;
    }
    function hipsPxY() {
      if (!vrm) return null;
      const b = vrm.humanoid.getNormalizedBoneNode('hips');
      return b ? _pxOf(b.getWorldPosition(new THREE.Vector3()))[1] : null;
    }
    function feetPxY() {
      if (!vrm) return null;
      let low = null;
      for (const s of ['left', 'right']) {
        const toe = vrm.humanoid.getNormalizedBoneNode(`${s}Toes`);
        const foot = vrm.humanoid.getNormalizedBoneNode(`${s}Foot`);
        const p = toe ? toe.getWorldPosition(new THREE.Vector3())
          : foot ? foot.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0, -0.05, 0)) : null;
        if (!p) continue;
        const y = _pxOf(p.toArray())[1];
        low = low === null ? y : Math.max(low, y);
      }
      return low;
    }

    // ── grab plumbing ──
    function _grabWorldPoint(x, y, depth) {
      _tp.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1, 0.5).unproject(camera);
      return camera.position.clone().addScaledVector(_tp.sub(camera.position).normalize(), depth);
    }
    function startGrab(part, x, y) {
      const b = vrm?.humanoid.getNormalizedBoneNode(PART_BONE[part]);
      if (!b) return;
      const w0 = b.getWorldPosition(new THREE.Vector3());
      pose.setTarget(part, w0.toArray());   // blend in from where it actually is
      grabDepth = camera.position.distanceTo(w0);
      grabId = part; grabDownAt = performance.now();
      postTouch(part, 'grab', x, y);
    }
    function endGrab(x, y) {
      if (!grabId) return;
      const holdMs = Math.round(performance.now() - grabDownAt);
      // long grab -> she shakes the arm out on release (docs/TOUCH.md)
      pose.release(grabId, { shake: holdMs > 2000 && part2arm(grabId) });
      postTouch(grabId, 'release', x, y, { hold_ms: holdMs });
      grabId = null; grabDepth = null;
    }
    const part2arm = (id) => id.startsWith('hand') || id.startsWith('arm');

    function postTouch(part, kind, x, y, extra = {}) {
      if (touchMode === 'off') return;
      if (!_touchGate.allow(part, kind)) return;
      fetch('/control/touch', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ part, kind, x: Math.round(x), y: Math.round(y), ...extra }),
      }).catch(() => {});
    }
    function postSitState(sitting) {
      fetch('/control/sit-state', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sitting }),
      }).catch(() => {});
    }
    function flashEmotion(name, value) {   // instant local reaction, no network
      motion.applyEmotion(name, value);
      setTimeout(() => {
        if (lastExpression) applyAction(lastExpression);   // hand back to the director
        else motion.applyEmotion(null, 0);
      }, 2600);
    }
    function reactTo(ev) {
      if (touchMode === 'off') return;
      const parts = computeParts();
      const hx = parts?.head ? parts.head[0] + parts.head[2] / 2 : innerWidth / 2;
      const side = Math.sign(_lastPt.x - hx) || 1;   // +1: touched right of her face
      if (ev.kind === 'pat') {           // happy/relaxed + lean into the pat
        pose.react('headTilt', { side });
        flashEmotion('happy', 0.7);
      } else if (ev.kind === 'poke') {   // surprise + flinch away from that side
        pose.react('flinch', { dir: side });
        motion.lookAway(0.8);
        flashEmotion('surprised', 0.8);
      } else if (ev.kind === 'tickle') { // happy + giggle wiggle
        pose.react('giggle');
        flashEmotion('happy', 0.6);
      }
    }

    // pointer capture phase (runs BEFORE the roam strip-drag handler)
    addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || !vrm || !motion.rig || e.target !== renderer.domElement) return;
      _lastPt.x = e.clientX; _lastPt.y = e.clientY;
      _touchPress.down(e.clientX, e.clientY, e.timeStamp || performance.now());
      const gs = _touchPress.setPart(hitTest(computeParts(), e.clientX, e.clientY));
      if (gs) startGrab(gs.part, e.clientX, e.clientY);
    }, true);
    addEventListener('pointermove', (e) => {
      _lastPt.x = e.clientX; _lastPt.y = e.clientY;
      const ms = e.timeStamp || performance.now();
      if (grabId) {                       // drive the IK in the grab plane
        pose.setTarget(grabId, _grabWorldPoint(e.clientX, e.clientY, grabDepth ?? 2));
        return;
      }
      const ev = _touchPress.move(e.clientX, e.clientY, ms);
      if (ev?.type === 'grab-start') startGrab(ev.part, e.clientX, e.clientY);
    }, true);
    addEventListener('pointerup', (e) => {
      const ms = e.timeStamp || performance.now();
      const end = _touchPress.up(ms);
      if (grabId) { endGrab(e.clientX, e.clientY); return; }
      if (!end) return;
      _touchRec.expire(ms);
      if (e.target !== renderer.domElement || !vrm || !motion.rig) return;
      const ev = end.kind === 'tap' ? _touchRec.tap(end.part, ms)
        : end.kind === 'stroke' ? _touchRec.stroke(end.part, end.holdMs, end.reversals)
        : null;
      if (!ev) return;
      postTouch(ev.part, ev.kind, e.clientX, e.clientY,
                end.kind === 'stroke' ? { strokes: end.reversals } : {});
      reactTo(ev);
    }, true);

    // every frame: still-hold deadline, walk freeze, sit-state seam
    function touchFrame(dt) {
      if (_touchPress.active && !grabId) {
        const ev = _touchPress.move(_lastPt.x, _lastPt.y, performance.now());
        if (ev?.type === 'grab-start') startGrab(ev.part, _lastPt.x, _lastPt.y);
      }
      _touchRec.expire(performance.now());
      const block = pose.active || !!pose.sitState;
      if (block !== touchBlocked) {
        touchBlocked = block;
        if (director?.walk) feed(director.walk.setBlocked(T(), 'touch', block));
      }
      if (pose.sitBlendDone && sitReported !== true) { sitReported = true; postSitState(true); }
      if (sitReported === true && pose.standBlendDone) { sitReported = false; postSitState(false); }
    }

    // Desktop bridge commands (docs/TOUCH.md §Desktop → page)
    function onCommand(cmd) {
      if (typeof cmd !== 'string') return;
      if (cmd.startsWith('sit:')) {
        const y = parseFloat(cmd.slice(4));
        if (Number.isFinite(y)) pose.sit(y, viewH());
      } else if (cmd === 'stand') {
        pose.stand();
      } else if (cmd.startsWith('touch-mode:')) {
        const m = cmd.slice('touch-mode:'.length);
        if (m === 'off' || m === 'quiet' || m === 'chatty') touchMode = m;
      }
      // press-hint:<limb|none> is optional in the contract; nothing to do yet
    }

    const _bboxV = new THREE.Vector3();
    let bboxAt = 0, xPostAt = 0;
    function postBbox() {
      const w = director?.walk;
      const rig = motion.rig;
      if (!w || !rig) return;
      const half = rig.shoulderWidth / 2 + 0.12
        + (motion.gesture && IK_ARM_GESTURES[motion.gesture.name] ? 0.35 : 0);
      const yTop = rig.bboxTop + 0.02, yBot = Math.min(rig.bboxBottom, 0) - 0.02;
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (const sx of [-half, half]) {
        for (const sy of [yTop, (yTop + yBot) / 2, yBot]) {
          _bboxV.set(w.x + sx, sy, 0.15).project(camera);
          const px = (_bboxV.x * 0.5 + 0.5) * innerWidth;
          const py = (-_bboxV.y * 0.5 + 0.5) * innerHeight;
          x0 = Math.min(x0, px); x1 = Math.max(x1, px);
          y0 = Math.min(y0, py); y1 = Math.max(y1, py);
        }
      }
      const pad = 16;
      const x = Math.max(0, Math.round(x0 - pad)), y = Math.max(0, Math.round(y0 - pad));
      const bw = Math.min(innerWidth - x, Math.round(x1 - x0 + pad * 2));
      const bh = Math.min(innerHeight - y, Math.round(y1 - y0 + pad * 2));
      // touch seams (docs/TOUCH.md): body-part rects + hips/feet line, CSS px.
      // Desktop ignores unknown keys; absent fields mean unknown.
      const parts = computeParts();
      const hy = hipsPxY(), fy = feetPxY();
      fetch('/control/bbox', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          x, y, w: bw, h: bh,
          ...(parts ? { parts } : {}),
          ...(hy != null ? { hips_y: Math.round(hy) } : {}),
          ...(fy != null ? { feet_y: Math.round(fy) } : {}),
        }),
      }).catch(() => {});
    }
    function walkHousekeeping(now) {
      updateWalkBounds();                       // tracks zoom / resize / persona
      if (now - bboxAt >= 0.1) { bboxAt = now; postBbox(); }
      if (now - xPostAt >= 5 && Math.abs(director.walk.x - (lastXSent ?? 0)) > 0.05) {
        xPostAt = now; persistWalkX();
      }
      // bubble + status pill follow her projected head down the strip
      const rig = motion.rig;
      if (rig) {
        _bboxV.set(director.walk.x, rig.headTop + 0.12, 0.15).project(camera);
        const px = (_bboxV.x * 0.5 + 0.5) * innerWidth;
        document.documentElement.style.setProperty(
          '--roam-x', `${Math.round(px - innerWidth / 2)}px`);
      }
    }
    // Left-drag along the strip: drag HER (not the window — desktop.py only
    // intercepts drags outside the walk region… in strip mode it never does).
    // desktop.py forwards real X clicks on her body here as synthetic events.
    window.__rikoClick = (kind, x, y) => {
      const el = document.elementFromPoint(x, y) || renderer.domElement;
      el.dispatchEvent(new PointerEvent(kind, {
        clientX: x, clientY: y, button: 0, buttons: kind === 'pointerdown' ? 1 : 0,
        bubbles: true, cancelable: true, pointerId: 1, isPrimary: true,
      }));
    };
    if (DESKTOP) {
      renderer.domElement.addEventListener('pointerdown', (e) => {
        console.log(`[page] pointerdown button=${e.button} at ${Math.round(e.clientX)},${Math.round(e.clientY)}`);
        if (!ROAM || !director.walk || e.button !== 0) return;
        const w = director.walk;
        feed(w.setBlocked(T(), 'dragging', true));
        let lastPx = e.clientX;
        const move = (ev) => {
          if (grabId) return;   // a limb grab owns this pointer (docs/TOUCH.md)
          const dx = (ev.clientX - lastPx) * stripGeometry().mPerPx;
          lastPx = ev.clientX;
          w.x = Math.min(w.bounds.max, Math.max(w.bounds.min, w.x + dx));
        };
        const up = () => {
          removeEventListener('pointermove', move);
          removeEventListener('pointerup', up);
          feed(w.setBlocked(T(), 'dragging', false));
          persistWalkX();
        };
        addEventListener('pointermove', move);
        addEventListener('pointerup', up);
      });
    }
    let lastExpression = null;
    function applyAction(a) {
      // one bad action must not kill the rest of this event batch
      try {
        // grabbed or sitting: no roaming, no idle gestures (gaze keeps going)
        if (pose.active && (a.type === 'gesture' || a.type === 'walk_start' || a.type === 'walk_turn')) {
          return;
        }
        if (TIMING && (a.type === 'gesture' || a.type === 'gesture_stop')) {
          (window.__actionTimeline = window.__actionTimeline || []).push(
            { t: T(), type: a.type, name: a.name });
        }
        if (a.type === 'gesture') {
          const c = clips[a.name];
          if (c) {  // a VRMA clip the owner dropped in takes over the body bones
            vrm.lookAt.autoUpdate = !c.tracker;
            if (c.tracker && !c.tracker.parent) scene.add(c.tracker);
            motion.playGesture(a.name, { clip: c.clip, loop: c.loop });
          } else {
            vrm.lookAt.autoUpdate = true;
            motion.playGesture(a.name);
          }
        } else if (a.type === 'gesture_stop') {
          motion.stopGesture(a.name);
          vrm.lookAt.autoUpdate = true;
        } else if (a.type === 'expression') {
          motion.applyEmotion(a.name, a.value);
          motion.tilt(a.tilt);
          if (a.away) motion.lookAway(a.hold || 2);
          lastExpression = a.name ? a : null;
        } else if (a.type === 'walk_start' || a.type === 'walk_turn') {
          // walk.js decided WHERE; motion.js moves the legs from the rig's
          // own leg geometry; the page turns her to face the way she goes
          motion.setWalk(a.dir, director.walk ? director.walk.speed : 0.6);
          faceWant = a.dir > 0 ? Math.PI / 2 : -Math.PI / 2;
        } else if (a.type === 'walk_stop') {
          motion.setWalk(0);              // blends the gait out smoothly
          faceWant = 0;                   // back to the viewer
          persistWalkX();
        }
      } catch (e) {
        console.warn('gesture action failed', a && a.type, a && a.name, e);
      }
    }
    const feed = (actions) => {
      if (FORCE && !FORCE_WALK) return;
      if (!vrm) return;
      for (const a of actions) {
        if (FORCE && FORCE_WALK && !a.type.startsWith('walk')) continue;
        applyAction(a);
      }
    };
    // re-issue whatever was running after a persona swap (new bones, new clips)
    function resumeLife() {
      const g = director.gesture;
      if (g && (g.loop || g.endsAt > T())) {
        applyAction({ type: 'gesture', name: g.name, loop: g.loop });
      }
      if (lastExpression) applyAction(lastExpression);
    }

    // The viewer 503s while the hub is still starting; keep asking until she's there.
    for (;;) {
      try { attach(await loadVRM('avatar.vrm')); break; }
      catch { start.textContent = 'Waiting for her avatar...'; await new Promise((r) => setTimeout(r, 2000)); }
    }
    feed(director.start(T()));

    // ── keyboard QA hook (?wavetest=1, with ?desktop=1): press the W shortcut
    //    for real at fixed seconds after she woke up — during the greeting
    //    cooldown and during a forced idle gesture — and POST the director's
    //    answer to /wavetest so the harness (client/tools/wave_check.py) can
    //    assert she actually waves. Anchored to wake, not page load.
    if (new URLSearchParams(location.search).get('wavetest')) {
      const wokeAt = T();
      const report = [];
      const snap = () => (director.gesture
        ? { name: director.gesture.name, endsAt: director.gesture.endsAt } : null);
      const pressW = (label, delayMs) => {
        setTimeout(() => {
          const before = snap();
          const act0 = director.lastActivity;
          dispatchEvent(new KeyboardEvent('keydown', { key: 'w', bubbles: true }));
          const entry = { label, t: +(T() - wokeAt).toFixed(2), before,
                          handlerRan: director.lastActivity !== act0,
                          afterNow: snap(),
                          pendingNow: director.pending ? director.pending.name : null };
          report.push(entry);
          // 600 ms later the frame loop has run: that is what she is really doing
          setTimeout(() => {
            entry.after = snap();
            entry.pending = director.pending ? director.pending.name : null;
          }, 600);
        }, delayMs);
      };
      pressW('after-startup-wave', 3500);   // startup wave over (2.4 s), inside the 25 s cooldown
      pressW('already-waving-again', 4200); // while the wave above should still run
      setTimeout(() => { director.nextIdleAt = T(); }, 7500);  // force an idle gesture now
      pressW('during-idle-gesture', 8200);  // W must cut in front of the idle one-shot
      setTimeout(async () => {
        try {
          await fetch('/wavetest', { method: 'POST',
            headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(report) });
        } catch { /* harness gone */ }
      }, 9200);
    }

    // ── visual QA capture: PNGs (and pose metrics) at fixed seconds after wake ──
    window.rikoCapture = () => renderer.domElement.toDataURL('image/png');
    // Pose metrics against the REAL rig, written for ANY VRM (0.x or 1.0;
    // bones a rig lacks report null instead of throwing — the owner's Furina
    // model has no chest bone, which used to kill every /measure POST).
    //   chin = head bone + (0, -0.5*headLen, +0.35*headLen)  [rig.chin, from motion.js]
    // with headLen from eye spacing (or neck->head bone distance). Metrics
    // include the rig's own arm/forearm/head lengths so the harness can state
    // acceptance thresholds RELATIVE to her size, and the NDC projection of
    // both hands/elbows so "inside the canvas with margin" is measurable.
    // (the character faces +z in this page; chest falls back to upperChest/spine)
    window.rikoMeasure = () => {
      if (!vrm) return null;
      const names = ['hips', 'spine', 'chest', 'upperChest', 'neck', 'head',
                     'leftShoulder', 'rightShoulder', 'leftUpperArm', 'rightUpperArm',
                     'leftLowerArm', 'rightLowerArm', 'leftHand', 'rightHand',
                     'leftUpperLeg', 'rightUpperLeg', 'leftLowerLeg', 'rightLowerLeg',
                     'leftFoot', 'rightFoot', 'eyeLeft', 'eyeRight'];
      const bones = {};
      for (const n of names) {
        const b = vrm.humanoid.getNormalizedBoneNode(n);
        bones[n] = b ? b.getWorldPosition(new THREE.Vector3()).toArray() : null;
      }
      const rig = motion.rig;
      const h = bones.head;
      if (!h) return { bones, chin: null, metrics: null };
      const chin = rig ? rig.chin
        : [h[0], h[1] - 0.11, h[2] + 0.08];  // headless fallback, same shape
      const chest = bones.chest || rig?.chest || bones.upperChest || bones.spine;
      const d = (a, b) => (a && b ? Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]) : null);
      // world -> NDC (-1..1 across the viewport). |x|,|y| <= 0.9 means "inside
      // the canvas with >= 5% margin"; z is the clip-space depth (-1..1 =
      // between the near and far planes).
      const _p = new THREE.Vector3();
      const ndc = (p) => {
        if (!p) return null;
        _p.set(p[0], p[1], p[2]).project(camera);
        return [_p.x, _p.y, _p.z];
      };
      const inCanvas = (n) => (n ? Math.abs(n[0]) <= 0.9 && Math.abs(n[1]) <= 0.9 && n[2] >= -1 && n[2] <= 1 : null);
      // world -> CANVAS PIXELS (the fake-desktop canvas can differ from the
      // viewport; everything visual is measured on the canvas)
      const _q = new THREE.Vector3();
      const worldPx = (p) => {
        if (!p) return null;
        _q.set(p[0], p[1], p[2]).project(camera);
        return [(_q.x * 0.5 + 0.5) * viewW(), (-_q.y * 0.5 + 0.5) * viewH()];
      };
      const headPx = worldPx([h[0], (rig?.headTop ?? h[1] + 0.09), h[2]]);
      const footWorld = bones.leftFoot && bones.rightFoot
        ? [bones.leftFoot[0], Math.min(bones.leftFoot[1], bones.rightFoot[1]), bones.leftFoot[2]]
        : (bones.leftFoot || bones.rightFoot);
      const footPx = worldPx(footWorld);
      const rArm = rig?.arms?.right, lArm = rig?.arms?.left;
      const handNdc = ndc(bones.rightHand), elbowNdc = ndc(bones.rightLowerArm);
      const lHandNdc = ndc(bones.leftHand), lElbowNdc = ndc(bones.leftLowerArm);
      return {
        t: performance.now() / 1000, bones, chin,
        rig: rig && {
          headLen: rig.headLen, headTop: rig.headTop, shoulderWidth: rig.shoulderWidth,
          armLen: rArm?.len ?? lArm?.len ?? null,
          upperLen: rArm?.l1 ?? lArm?.l1 ?? null,
          forearmLen: rArm?.l2 ?? lArm?.l2 ?? null,
          bboxTop: rig.bboxTop, bboxBottom: rig.bboxBottom,
        },
        ndc: { rightHand: handNdc, rightElbow: elbowNdc, leftHand: lHandNdc, leftElbow: lElbowNdc },
        metrics: {
          handToChin: d(bones.rightHand, chin),
          leftHandToRightElbow: d(bones.leftHand, bones.rightLowerArm),
          handAboveShoulderY: bones.rightHand && bones.rightShoulder
            ? bones.rightHand[1] - bones.rightShoulder[1] : null,
          handAboveHeadY: bones.rightHand ? bones.rightHand[1] - h[1] : null,
          handZ_vs_chestZ: bones.rightHand && chest ? bones.rightHand[2] - chest[2] : null,
          elbowZ_vs_chestZ: bones.rightLowerArm && chest ? bones.rightLowerArm[2] - chest[2] : null,
          handX: bones.rightHand ? bones.rightHand[0] : null,
          handInCanvas: inCanvas(handNdc),
          elbowInCanvas: inCanvas(elbowNdc),
          leftHandInCanvas: inCanvas(lHandNdc),
          leftElbowInCanvas: inCanvas(lElbowNdc),
          gazeDbg: motion.__debug(),
          // touch/pose seams for the capture harness (docs/TOUCH.md)
          parts: computeParts(), hipsYpx: hipsPxY(), feetYpx: feetPxY(),
          pose: pose.debug(), touchMode,
          headFootPx: headPx && footPx ? Math.round(footPx[1] - headPx[1]) : null,
          feetFromBottomPx: footPx ? Math.round(viewH() - footPx[1]) : null,
          visualScale: Math.round(scaleShown * 1000) / 1000,
          windowScale: Math.round(windowScale * 1000) / 1000,
          canvasH: viewH(),
          // world pos of the eyes node (VRM0 rigs have no normalized eye
          // bones): ground truth for where the face points in renders
          eyesWorld: (() => {
            const n = vrm.scene.getObjectByName('両目') || vrm.scene.getObjectByName('leftEye');
            if (!n) return null;
            const p = n.getWorldPosition(new THREE.Vector3());
            return [+p.x.toFixed(4), +p.y.toFixed(4), +p.z.toFixed(4)];
          })(),
          ...(director?.walk ? {
            walkX: director.walk.x,
            walkSpeed: director.walk.speed,
            walking: director.walk.walking ? 1 : 0,
            walkBlend: motion.walkActive ? motion.walkActive.w : 0,
            walkPhase: motion.walkActive ? motion.walkActive.phase : 0,
            sceneRotY: vrm.scene.rotation.y,
            // head-forward vector: midpoint(eyes) - head, in world space.
            // Facing the camera (+z) reads (0,0,+); screen-right (+x) reads (+,0,0).
            facingVec: bones.eyeLeft && bones.eyeRight && h
              ? [(bones.eyeLeft[0] + bones.eyeRight[0]) / 2 - h[0],
                 0,
                 (bones.eyeLeft[2] + bones.eyeRight[2]) / 2 - h[2]] : null,
            // which foot leads along the world x axis (travel dir = sign of walkSpeed*dir)
            footLeadX: bones.leftFoot && bones.rightFoot
              ? bones.leftFoot[0] - bones.rightFoot[0] : null,
          } : {}),
          ...(window.__waveTrack && Number.isFinite(window.__waveTrack.min) ? {
            waveLateralSwing: window.__waveTrack.max - window.__waveTrack.min,
            wavePeakAboveShoulderY: window.__waveTrack.peakY,
            waveMaxHandNdcAbsX: window.__waveTrack.maxNdcAbsX,
            waveMaxHandNdcAbsY: window.__waveTrack.maxNdcAbsY,
          } : {}),
        },
      };
    };
    // calibration helper: slap a gesture's pose (Eulers + IK arms) on right now
    window.rikoPreview = (name, t) => motion.previewGesture(name, t);
    if (FORCE) {
      for (const item of String(FORCE).split(',')) {
        const [name, at = '0'] = item.trim().split('@');
        const atMs = Math.max(0, Number(at) || 0) * 1000;
        if (name === 'walk' && director.walk) {
          // QA: start a long forced walk (capture_frames walk cycle shots);
          // roamNow() is idempotent while walking so several @times are fine
          setTimeout(() => feed(director.walk.roamNow(T(), { dir: 1, seconds: 120 })), atMs);
          continue;
        }
        if (!GESTURES[name]) continue;
        setTimeout(() => motion.playGesture(name), atMs);
      }
      // Per-frame tracker for the wave acceptance numbers (a 4-frame
      // snapshot cadence would miss the oscillation extremes):
      // lateral x swing of the right hand + peak height over the shoulder +
      // the hand's worst NDC excursion (inside |0.9| = in canvas, 5% margin).
      window.__waveTrack = { min: Infinity, max: -Infinity, peakY: -Infinity,
                             maxNdcAbsX: 0, maxNdcAbsY: 0 };
      const _vp = new THREE.Vector3(), _vs = new THREE.Vector3();
      const trackWave = () => {
        const g = motion.gesture;
        // only inside the oscillation window (after the blend-in) so the
        // reported swing width is the wave itself, not the arm going up
        if (g && g.name === 'wave' && g.t > 0.5 && vrm) {
          const hb = vrm.humanoid.getNormalizedBoneNode('rightHand');
          const sb = vrm.humanoid.getNormalizedBoneNode('rightShoulder');
          if (hb && sb) {
            const p = hb.getWorldPosition(_vp), s = sb.getWorldPosition(_vs);
            const w = window.__waveTrack;
            w.min = Math.min(w.min, p.x); w.max = Math.max(w.max, p.x);
            w.peakY = Math.max(w.peakY, p.y - s.y);
            _vp.copy(p).project(camera);
            w.maxNdcAbsX = Math.max(w.maxNdcAbsX, Math.abs(_vp.x));
            w.maxNdcAbsY = Math.max(w.maxNdcAbsY, Math.abs(_vp.y));
          }
        }
        requestAnimationFrame(trackWave);
      };
      requestAnimationFrame(trackWave);
    }
    if (CAPTURE && WHEEL_ZOOM_QA) {
      // ?wheelzoom=startMs:count:deltaY:gapMs[;same;...] — fire real wheel
      // events at the canvas: synthetic scroll-zoom gestures for frame-by-
      // frame capture (several ';' specs test grow THEN shrink in one run;
      // harness: client/tools/capture_frames.py --gestures).
      for (const spec of String(WHEEL_ZOOM_QA).split(';')) {
        const [g0, gN, gDy, gGap] = spec.split(':').map(Number);
        if (!Number.isFinite(g0) || !Number.isFinite(gN)) continue;
        setTimeout(() => {
          let fired = 0;
          const iv = setInterval(() => {
            renderer.domElement.dispatchEvent(new WheelEvent('wheel', {
              deltaY: gDy, deltaMode: 0, bubbles: true, cancelable: true,
            }));
            if (++fired >= gN) clearInterval(iv);
          }, gGap);
        }, g0);
      }
    }
    if (CAPTURE) {
      const wokeAt = performance.now();
      for (const s of String(CAPTURE).split(',').map(Number).filter((n) => n > 0)) {
        setTimeout(async () => {
          try {
            await new Promise((r) => requestAnimationFrame(r));  // a rendered frame in the buffer
            const t = ((performance.now() - wokeAt) / 1000).toFixed(2);
            await fetch(`/capture?t=${t}`, {
              method: 'POST', headers: { 'Content-Type': 'text/plain' },
              body: window.rikoCapture(),
            });
            await fetch(`/measure?t=${t}`, {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(window.rikoMeasure()),
            });
          } catch { /* harness gone; whatever it captured is captured */ }
        }, s * 1000);
      }
    }

    // ── Lip sync: band energies from the voice pick a vowel shape (aa/ih/ee/oh/ou) ──
    const voice = document.getElementById('voice');
    const audioCtx = new AudioContext();
    const analyser = audioCtx.createAnalyser();
    audioCtx.createMediaElementSource(voice).connect(analyser);
    analyser.connect(audioCtx.destination);
    analyser.fftSize = 1024;
    analyser.minDecibels = -90;
    analyser.maxDecibels = -10;
    const freqBytes = new Uint8Array(analyser.frequencyBinCount);
    const freqDb = new Float32Array(analyser.frequencyBinCount);

    function feedVowel() {
      analyser.getByteFrequencyData(freqBytes);
      for (let i = 0; i < freqBytes.length; i++) {
        freqDb[i] = analyser.minDecibels + (freqBytes[i] / 255) * (analyser.maxDecibels - analyser.minDecibels);
      }
      motion.setVowelTarget(vowelWeights(freqDb, audioCtx.sampleRate));
    }

    // ── Speech bubble, status pill, what she heard ──
    const bubble = document.getElementById('bubble');
    const heard = document.getElementById('heard');
    const status = document.getElementById('status');
    const approval = document.getElementById('approval');
    const timers = {};
    function flash(el, text, seconds, cls = '') {
      el.textContent = text;
      el.className = `show ${cls}`;
      clearTimeout(timers[el.id]);
      if (seconds) timers[el.id] = setTimeout(() => el.classList.remove('show'), seconds * 1000);
    }
    // Approval bubble: desktop.py emits 'approval' while a tool waits for an
    // answer; Enter says yes, Esc says no (a hub-side timeout denies anyway).
    let approvalOpen = false;
    function showApproval(summary, seconds) {
      approvalOpen = true;
      if (director.walk) feed(director.walk.setBlocked(T(), 'approval', true));
      flash(approval, `Can I ${summary}?  Enter = yes, Esc = no`, 0);
    }
    function hideApproval(answered) {
      if (!approvalOpen) return;
      approvalOpen = false;
      if (director.walk) feed(director.walk.setBlocked(T(), 'approval', false));
      approval.classList.remove('show');
      if (answered) flash(status, answered === 'yes' ? 'thank you :)' : 'ok, not then', 3);
    }
    const STATUS_TEXT = { listening: 'listening…', hearing: 'hmm?', thinking: 'thinking…' };
    function setStatus(state) {
      if (STATUS_TEXT[state]) flash(status, STATUS_TEXT[state], 0, state);
      else status.classList.remove('show');
      // she looks at you while she's with you: camera-lock on the social states
      motion.setGazeMode(state === 'listening' || state === 'hearing' || state === 'speaking' ? 'camera' : 'free');
    }

    // ── Text input ──
    const input = document.getElementById('input');
    const control = (cmd) => fetch(`/control/${cmd}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}',
    }).catch(() => {});
    // The W shortcut / riko-ctl 'wave': ask the director for a social wave.
    function requestWave() { feed(director.requestWave(T())); }
    function openInput() {
      input.classList.add('show');
      input.focus();
      if (director.walk) feed(director.walk.setBlocked(T(), 'typing', true));
      control('input-opened');
    }
    function closeInput() {
      input.classList.remove('show');
      input.blur();
      if (director.walk) feed(director.walk.setBlocked(T(), 'typing', false));
      control('input-closed');
    }
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { input.value = ''; closeInput(); }
      if (e.key === 'Enter' && !e.isComposing) {
        const text = input.value.trim();
        input.value = '';
        if (text) fetch('/say', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
        closeInput();
      }
      e.stopPropagation();
    });
    // ── In-window keyboard shortcuts ──
    // The keys come from /settings (desktop.shortcuts in character_config.yaml,
    // resolved by riko/shortcuts.py) as actions -> ["Ctrl+Shift+Backspace", ...].
    // They only fire while this window has focus, and never use Super/Meta —
    // that key belongs to the window manager. Escape and Enter inside the text
    // box are handled by the box itself, above.
    const SHORTCUTS = {};
    for (const [action, keys] of Object.entries(settings.shortcuts || {})) {
      const binds = [];
      for (const b of Array.isArray(keys) ? keys : [keys]) {
        if (typeof b !== 'string' || !b) continue;
        const parts = b.split('+');
        const key = parts.pop().toLowerCase();  // Python canonicalises, incl. 'Space'
        const mods = new Set(parts.map((m) => m.toLowerCase()));
        binds.push({ key, ctrl: mods.has('ctrl'), alt: mods.has('alt'), shift: mods.has('shift') });
      }
      SHORTCUTS[action] = binds;
    }
    const eventKey = (e) => (e.key === ' ' ? 'space' : String(e.key).toLowerCase());
    const matches = (e, b) =>
      eventKey(e) === b.key && !!e.ctrlKey === b.ctrl && !!e.altKey === b.alt && !!e.shiftKey === b.shift;
    const actionFor = (e) =>
      Object.keys(SHORTCUTS).find((a) => SHORTCUTS[a].some((b) => matches(e, b))) ?? null;

    // Push-to-talk is a real hold: the first keydown starts recording, the
    // matching keyup (or losing focus mid-hold) stops and sends.
    let talkHeld = false;
    const talkKeys = new Set((SHORTCUTS.talk || []).map((b) => b.key));
    function talkRelease() {
      if (!talkHeld) return;
      talkHeld = false;
      control('talk-stop');
    }
    let forgetArmedAt = 0;
    addEventListener('keydown', (e) => {
      if (!DESKTOP || e.target === input) return;  // the text box owns its own keys
      if (approvalOpen && (e.key === 'Enter' || e.key === 'Escape')) {
        e.preventDefault();  // the ask wins over the 'type' shortcut on Enter
        approvalAnswer(e.key === 'Enter');
        return;
      }
      if (e.key === 'Escape') { control('hide-input'); return; }
      if (e.repeat) return;
      const action = actionFor(e);
      if (!action) return;
      e.preventDefault();
      if (action === 'type') openInput();
      else if (action === 'talk') { talkHeld = true; control('talk-start'); }
      else if (action === 'wave') requestWave();
      else if (action === 'persona_next') control('persona-next');
      else if (action === 'hide') control('hide');
      else if (action === 'listen_mode') control('listen-mode');
      else if (action === 'quit') control('quit');
      else if (action === 'forget') {
        // two presses within 3 s, so an accidental Ctrl+Shift+Backspace is not amnesia
        const now = Date.now();
        if (now - forgetArmedAt <= 3000) {
          forgetArmedAt = 0;
          status.classList.remove('show');
          control('forget');
        } else {
          forgetArmedAt = now;
          flash(status, 'Press again within 3 s to forget the chat', 3);
        }
      }
    });
    addEventListener('keyup', (e) => {
      if (talkHeld && talkKeys.has(eventKey(e))) talkRelease();  // modifiers ignored on release
    });
    addEventListener('blur', talkRelease);  // window lost focus mid-hold: send what we have

    function approvalAnswer(ok) {
      hideApproval(ok ? 'yes' : 'no');
      control(ok ? 'approve' : 'deny');
    }

    window.riko = { openInput, closeInput, requestWave, resetSize: resetAvatarSize,
                    motion, director, measure: () => window.rikoMeasure(),
                    onCommand,                     // desktop bridge commands (TOUCH.md)
                    pose: () => pose,              // QA/item-6 handle on the pose layer
                    touchDebug: () => ({ mode: touchMode, grab: grabId, sitReported,
                                         parts: computeParts(), hips_y: hipsPxY(),
                                         feet_y: feetPxY(), pose: pose.debug() }),
                    scale: () => ({ shown: scaleShown, target: scaleTarget, window: windowScale }),
                    wheel: (deltaY, deltaMode = 0) => renderer.domElement.dispatchEvent(
                      new WheelEvent('wheel', { deltaY, deltaMode, bubbles: true, cancelable: true })),
                    resizeWindow: (w) => FAKE_DESK && postScale(w, w, false) };
                    // desktop.py calls these; motion/director/measure are for debugging,
                    // riko-ctl wave and the smoke test, resetSize for the tray's Reset size,
                    // scale/wheel/resizeWindow for the capture harness and manual QA

    // ── Ask Python for her next line and UI events, tell it when a clip is done ──
    voice.onended = voice.onerror = () => fetch('/done', { method: 'POST' });

    function handle(ev) {
      if (ev.type === 'status') {
        setStatus(ev.state);
        feed(director.status(T(), ev.state));
      } else if (ev.type === 'say') {
        flash(bubble, ev.text, (ev.seconds || 0) + BUBBLE_SECONDS);
        if (TIMING && Array.isArray(ev.actions) && ev.actions.length) {
          (window.__actionTimeline = window.__actionTimeline || []).push(
            { t: T(), type: 'say', actions: ev.actions, seconds: ev.seconds || 0 });
        }
        feed(director.say(T(), { emotion: ev.emotion || 'neutral',
                                 seconds: ev.seconds || 0, text: ev.text || '',
                                 actions: ev.actions || [] }));
      } else if (ev.type === 'heard') {
        flash(heard, ev.text, 6);
        feed(director.heard(T(), ev.text || ''));
      } else if (ev.type === 'error') {
        flash(bubble, ev.text, 6, 'error');
        feed(director.error(T()));
      } else if (ev.type === 'approval') {
        showApproval(ev.summary, ev.timeout_s);
      } else if (ev.type === 'approval_done') {
        hideApproval('');  // answered elsewhere (riko-ctl, or it timed out)
      } else if (ev.type === 'tool' && ev.phase === 'start') {
        flash(status, ev.label ? `using ${ev.label}` : 'using a tool…', 20, 'thinking');
      } else if (ev.type === 'open_input') openInput();
      else if (ev.type === 'close_input') closeInput();
      else if (ev.type === 'persona') {
        // Someone switched the persona (web page, riko-ctl, or she switched herself):
        // fetch her new body and swap without reloading; her greeting arrives as a 'say'.
        // Duplicated events for the SAME persona+version are ignored — the hub
        // poller (or a replay after a hub restart) must not re-load and re-wave.
        const key = `${ev.id}:${ev.avatar_version}`;
        if (key === attachedKey) return;
        loadVRM(`avatar.vrm?v=${encodeURIComponent(key)}`)
          .then((model) => {
            attach(model);          // motion re-targets gestures + expression on the new bones
            attachedKey = key;
            feed(director.persona(T(), ev));
            // ...and wear her saved SIZE: /settings answers for the NEW
            // active persona, so re-read the scale and let the desktop
            // resize the window (jump, no glide: it is a fresh start).
            fetch('/settings').then((r) => r.json()).then((st) => {
              const s = clampScale(st && st.avatar_scale);
              if (Math.abs(s - scaleTarget) > 1e-6) {
                scaleTarget = s;
                scaleShown = s;
                manualFrame = false;
                sizeGesture.reset();
                postScale(s, s, false);   // resize event re-frames the camera
              }
            }).catch(() => {});
          })
          .catch(() => location.reload());  // if her new body won't load, reload the page
      }
    }

    async function checkForVoice() {
      try {
        const { audio, events = [] } = await (await fetch('/next')).json();
        events.forEach(handle);
        if (audio) {
          voice.src = audio;
          await voice.play();
        }
      } catch { /* Python is not running; keep asking */ }
    }

    // Browsers only allow sound after a click, so wait for one. The desktop app allows it up front.
    const start = document.getElementById('start');
    function begin() {
      start.remove();
      audioCtx.resume();
      if (DESKTOP) console.log(`Riko page ready, viewport ${innerWidth}x${innerHeight}`);
      setInterval(checkForVoice, DESKTOP ? 150 : 250);
      if (TIMING) {
        setTimeout(() => fetch('/timeline', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(window.__actionTimeline || []),
        }).catch(() => {}), TIMING * 1000);
      }
    }
    if (DESKTOP || CAPTURE) begin();  // capture mode: no click available in a headless run
    else {
      start.textContent = 'Click to start';
      start.onclick = begin;
    }

    // ── She follows the pointer inside her window (mouse only) ──
    addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse') motion.setPointer(e.clientX, e.clientY, true); });
    document.addEventListener('pointerleave', () => motion.setPointer(0, 0, false));

    // ── Every frame ──
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const dt = clock.getDelta();
      // size-changed rule (scale.js): re-frame BEFORE this frame renders,
      // whatever the native resize event did or did not do yet.
      if (sizeChanged(viewW(), viewH(), framedW, framedH)) syncViewport();
      if (DESKTOP && !manualFrame) {
        // render the zoom EVERY frame (glide + camera re-frame), and when
        // the wheel has been quiet for GESTURE_IDLE_MS ask the desktop to
        // FIT the window to the final scale (once per gesture)
        const next = approachScale(scaleShown, scaleTarget, dt);
        if (next !== scaleShown) {
          scaleShown = next;
          applyScaleFrame(scaleShown);
        }
        const fit = sizeGesture.tick(performance.now(), scaleTarget);
        if (fit !== null) postScale(scaleTarget, fit, false);
      }
      feed(director.tick(T(), dt));  // idle gestures, endings, decay, roam schedule
      touchFrame(dt);                // press deadlines, walk freeze, sit-state (TOUCH.md)
      if (ROAM && director.walk && vrm) {
        // root motion: the scene carries her along the strip; the camera
        // stays put so the visible canvas IS the strip width, and turns her
        // toward the direction of travel (and back to the viewer on stop)
        vrm.scene.position.x = director.walk.x + pose.flinchX;
        const ry = vrm.scene.rotation.y;
        vrm.scene.rotation.y = ry + (faceWant - ry) * (1 - Math.exp(-dt / 0.16));
        walkHousekeeping(T());
      } else if (vrm && pose.flinchX !== 0) {
        vrm.scene.position.x = pose.flinchX;   // poke flinch outside roam mode too
      } else if (vrm && vrm.scene.position.x !== 0 && !ROAM) {
        vrm.scene.position.x = 0;
      }
      feedVowel();
      motion.update(dt);
      pose.apply(dt, { viewH: viewH() });   // pose layer on TOP of the life layer
      vrm.update(dt);
      controls.update();  // runs the glide
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
