<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Riko</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; font: 15px/1.35 system-ui, sans-serif; }
    html.desktop, body.desktop { background: transparent; }
    canvas { display: block; }
    audio { display: none; }  /* an inline audio element would reserve a strip at the bottom of the page */
    #start {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: #444; background: rgba(255, 255, 255, 0.8); cursor: pointer;
    }

    /* Her speech bubble, at the top so it never covers her face for long */
    #bubble {
      position: fixed; top: 10px; left: 12px; right: 12px; max-height: 32vh; overflow-y: auto;
      padding: 10px 14px; border-radius: 16px; color: #2b2233;
      background: rgba(255, 255, 255, 0.93); box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
      opacity: 0; transform: translateY(-8px); transition: opacity .25s, transform .25s; pointer-events: none;
      scrollbar-width: none;
    }
    #bubble.show { opacity: 1; transform: none; pointer-events: auto; }
    #bubble.error { background: rgba(255, 228, 228, 0.95); color: #7a1c1c; font-size: 13px; }

    /* What she heard you say + what she's doing */
    #hud {
      position: fixed; left: 12px; right: 12px; bottom: 64px; display: flex; flex-direction: column;
      align-items: flex-end; gap: 6px; pointer-events: none;
    }
    #heard, #status {
      max-width: 85%; padding: 5px 11px; border-radius: 12px; font-size: 13px;
      background: rgba(30, 25, 45, 0.78); color: #f3eefc; opacity: 0; transition: opacity .25s;
    }
    #heard.show, #status.show { opacity: 1; }
    #status { align-self: center; }
    #status.listening { background: rgba(200, 40, 70, 0.88); }
    #status.listening::before { content: "● "; animation: blink 1s infinite; }
    /* Approval ask: "Can I …? Enter = yes, Esc = no" (desktop.py, R2-F) */
    #approval {
      max-width: 92%; padding: 7px 13px; border-radius: 12px; font-size: 14px; align-self: center;
      background: rgba(255, 176, 32, 0.94); color: #241a02; opacity: 0; transition: opacity .25s;
    }
    #approval.show { opacity: 1; }
    @keyframes blink { 50% { opacity: .2; } }

    /* Text input: Enter (or the global shortcut) opens it, Esc closes it */
    #input {
      position: fixed; left: 10px; right: 10px; bottom: 12px; display: none;
      padding: 10px 14px; border: 2px solid rgba(140, 100, 220, 0.9); border-radius: 22px; outline: none;
      font: inherit; color: #221a30; background: rgba(255, 255, 255, 0.96); box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
    }
    #input.show { display: block; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.4.1/lib/three-vrm.module.min.js",
        "@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3.5.5/lib/three-vrm-animation.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="start">Loading...</div>
  <div id="bubble"></div>
  <div id="hud"><div id="heard"></div><div id="approval"></div><div id="status"></div></div>
  <input id="input" type="text" placeholder="Say something to her… (Enter to send, Esc to close)" autocomplete="off">
  <audio id="voice"></audio>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
    import { VRMAnimationLoaderPlugin, createVRMAnimationClip } from '@pixiv/three-vrm-animation';
    import { Director } from './js/director.js';
    import { GESTURES, vowelWeights, sampleGesture, mirrorPose } from './js/gestures.js';
    import { AvatarMotion } from './js/motion.js';

    // desktop.py opens this page with ?desktop=1: see-through background, no click-to-start,
    // and the whole body in frame. In a normal browser it looks like it always did.
    const DESKTOP = new URLSearchParams(location.search).has('desktop');
    // Headless visual QA hook (?capture=2,10,30): POST a PNG of the canvas to
    // /capture?t=<sec> and the pose metrics (window.rikoMeasure) to
    // /measure?t=<sec> that many seconds after she woke up. Nothing else
    // changes; the harness is client/tools/capture_frames.py.
    const CAPTURE = new URLSearchParams(location.search).get('capture');
    // QA hook (?force=think@0,wave@12): silence the director and play the named
    // built-in gesture(s) at the given seconds after she woke up, so poses can
    // be photographed and measured at exact times.
    const FORCE = new URLSearchParams(location.search).get('force');
    if (DESKTOP) {
      // Both elements paint a white background by default; on HTML it is not covered
      // by the body rule, and Qt would happily show that white as an opaque box.
      document.documentElement.classList.add('desktop');
      document.body.classList.add('desktop');
    }
    const settings = await fetch('/settings').then((r) => r.json()).catch(() => ({}));
    const BUBBLE_SECONDS = settings.bubble_seconds ?? 8;

    // ── Scene ──
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: DESKTOP, preserveDrawingBuffer: !!CAPTURE });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(innerWidth, innerHeight);
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    if (DESKTOP) renderer.setClearColor(0x000000, 0);  // fully transparent around her
    else scene.background = new THREE.Color(0xffffff);
    const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 20);
    const light = new THREE.DirectionalLight(0xffffff, Math.PI);
    light.position.set(1, 1, 1);
    scene.add(light);
    if (DESKTOP) scene.add(new THREE.AmbientLight(0xffffff, 0.6));  // no white room to bounce off, so lift the shadows

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ── Load her ──
    // The avatar is the ACTIVE persona's, served by riko/viewer.py from the hub.
    // On a 'persona' event the page fetches /avatar.vrm?v=<id>-<version> again
    // and swaps the model without reloading (her greeting arrives as a 'say').
    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));
    loader.register((parser) => new VRMAnimationLoaderPlugin(parser));

    // Which persona body the page is showing ('<id>:<avatar_version>'), so
    // duplicated 'persona' events for the same body are ignored. Unknown
    // until the first event (the initial load always serves the active one).
    let attachedKey = null;

    const motion = new AvatarMotion(THREE, { scene, camera });
    let vrm = null;

    async function loadVRM(url) {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error(`avatar ${res.status}`);
      const data = await res.arrayBuffer();
      const gltf = await new Promise((ok, bad) => loader.parse(data, '', ok, bad));
      if (!gltf.userData.vrm) throw new Error('not a VRM file');
      return gltf.userData.vrm;
    }

    // ── Optional VRMA gesture clips: files dropped into client/animations/
    //    (served through /animations.json) replace the built-in gestures. ──
    const vrmas = {};   // gesture name -> parsed VRMAnimation (persona-retargetable)
    const clips = {};   // gesture name -> {clip, loop} for the current persona
    try {
      const listing = await fetch('/animations.json', { cache: 'no-store' }).then((r) => r.json());
      for (const item of listing.animations || []) {
        const res = await fetch(item.url, { cache: 'no-store' });
        if (!res.ok) continue;
        const buf = await res.arrayBuffer();
        const gltf = await new Promise((ok, bad) => loader.parse(buf, '', ok, bad));
        const vrma = gltf.userData.vrmAnimations?.[0];
        if (vrma) vrmas[item.name] = vrma;
      }
    } catch { /* no animations directory, built-in gestures it is */ }

    function rebuildClips() {
      for (const [name, vrma] of Object.entries(vrmas)) {
        clips[name] = { clip: createVRMAnimationClip(vrma, vrm), loop: !!vrma.meta?.loop,
                        tracker: vrma.lookAtTracker || null };
      }
    }

    function attach(model) {
      if (vrm) {  // old persona: out of the scene, GPU memory freed
        motion.detach(vrm);
        scene.remove(vrm.scene);
        VRMUtils.deepDispose(vrm.scene);
        vrm.dispose();
      }
      vrm = model;
      VRMUtils.rotateVRM0(vrm);  // older VRM 0.x models face away without this
      scene.add(vrm.scene);

      // Arms down. VRM 0.x models are mirrored on this axis, so the angle flips.
      // (motion.js blends gestures toward this same rest rotation.)
      const arm = vrm.meta.metaVersion === '0' ? -1.3 : 1.3;
      vrm.humanoid.getNormalizedBoneNode('leftUpperArm').rotation.z = -arm;
      vrm.humanoid.getNormalizedBoneNode('rightUpperArm').rotation.z = arm;

      // Reframe for this model's height so short and tall personas look the same.
      const headY = vrm.humanoid.getNormalizedBoneNode('head').getWorldPosition(new THREE.Vector3()).y;
      if (DESKTOP) {
        camera.position.set(0, headY * 0.68, headY * 2.6);  // whole body, a little room above for the bubble
        controls.target.set(0, headY * 0.62, 0);
      } else {
        camera.position.set(0, headY * 0.94, headY * 1.37);
        controls.target.set(0, headY * 0.9, 0);
      }
      motion.attach(vrm);   // re-targets bones, gaze, and gestures onto the new body
      rebuildClips();
      resumeLife();         // whatever the director had running, replay on this body
    }

    // ── Camera: drag to rotate, right-drag to move her, scroll to zoom.
    //    Desktop: drag moves the window, right-drag rotates, shift-drag moves her, scroll zooms. ──
    const controls = new OrbitControls(camera, renderer.domElement);
    if (DESKTOP) {
      controls.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
    } else {
      controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
    }
    controls.minDistance = 0.5;
    controls.maxDistance = 6;
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;  // lower = longer glide
    addEventListener('contextmenu', (e) => e.preventDefault());

    // ── The director: decides what she does, motion.js does the moving ──
    const T = () => performance.now() / 1000;
    const director = new Director();
    let lastExpression = null;
    function applyAction(a) {
      // one bad action must not kill the rest of this event batch
      try {
        if (a.type === 'gesture') {
          const c = clips[a.name];
          if (c) {  // a VRMA clip the owner dropped in takes over the body bones
            vrm.lookAt.autoUpdate = !c.tracker;
            if (c.tracker && !c.tracker.parent) scene.add(c.tracker);
            motion.playGesture(a.name, { clip: c.clip, loop: c.loop });
          } else {
            vrm.lookAt.autoUpdate = true;
            motion.playGesture(a.name);
          }
        } else if (a.type === 'gesture_stop') {
          motion.stopGesture(a.name);
          vrm.lookAt.autoUpdate = true;
        } else if (a.type === 'expression') {
          motion.applyEmotion(a.name, a.value);
          motion.tilt(a.tilt);
          if (a.away) motion.lookAway(a.hold || 2);
          lastExpression = a.name ? a : null;
        }
      } catch (e) {
        console.warn('gesture action failed', a && a.type, a && a.name, e);
      }
    }
    // In ?force= mode the director is silenced: only the forced gestures move her.
    const feed = (actions) => { if (FORCE || !vrm) return; for (const a of actions) applyAction(a); };
    // re-issue whatever was running after a persona swap (new bones, new clips)
    function resumeLife() {
      const g = director.gesture;
      if (g && (g.loop || g.endsAt > T())) {
        applyAction({ type: 'gesture', name: g.name, loop: g.loop });
      }
      if (lastExpression) applyAction(lastExpression);
    }

    // The viewer 503s while the hub is still starting; keep asking until she's there.
    for (;;) {
      try { attach(await loadVRM('avatar.vrm')); break; }
      catch { start.textContent = 'Waiting for her avatar...'; await new Promise((r) => setTimeout(r, 2000)); }
    }
    feed(director.start(T()));

    // ── visual QA capture: PNGs (and pose metrics) at fixed seconds after wake ──
    window.rikoCapture = () => renderer.domElement.toDataURL('image/png');
    // Pose metrics against the REAL rig. The chin point is defined here and
    // used by client/tools/capture_frames.py acceptance checks:
    //   anchor = head-bone world position + head-local (0, -0.08, +0.04)
    //   chin   = midpoint(head, anchor)   (~8 cm below the head origin, forward)
    // dist(hand, chin) and dist(leftHand, rightLowerArm-origin = right elbow)
    // are the think checks; wave reads handY - shoulderY and the lateral x of
    // the right hand across the oscillation; z vs chest.z flags a limb sunk
    // into the torso (the character faces +z in this page).
    window.rikoMeasure = () => {
      if (!vrm) return null;
      const names = ['hips', 'spine', 'chest', 'upperChest', 'neck', 'head',
                     'leftShoulder', 'rightShoulder', 'leftUpperArm', 'rightUpperArm',
                     'leftLowerArm', 'rightLowerArm', 'leftHand', 'rightHand'];
      const bones = {};
      for (const n of names) {
        const b = vrm.humanoid.getNormalizedBoneNode(n);
        bones[n] = b ? b.getWorldPosition(new THREE.Vector3()).toArray() : null;
      }
      const h = bones.head;
      if (!h) return { bones, chin: null, metrics: null };
      const hq = vrm.humanoid.getNormalizedBoneNode('head')
        .getWorldQuaternion(new THREE.Quaternion());
      const off = new THREE.Vector3(0, -0.08, 0.04).applyQuaternion(hq);
      const chin = [h[0] + off.x / 2, h[1] + off.y / 2, h[2] + off.z / 2];
      const d = (a, b) => (a && b ? Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]) : null);
      return {
        t: performance.now() / 1000, bones, chin,
        metrics: {
          handToChin: d(bones.rightHand, chin),
          leftHandToRightElbow: d(bones.leftHand, bones.rightLowerArm),
          handAboveShoulderY: bones.rightHand[1] - bones.rightShoulder[1],
          handAboveHeadY: bones.rightHand[1] - bones.head[1],
          handZ_vs_chestZ: bones.rightHand[2] - bones.chest[2],
          elbowZ_vs_chestZ: bones.rightLowerArm[2] - bones.chest[2],
          handX: bones.rightHand[0],
          ...(window.__waveTrack && Number.isFinite(window.__waveTrack.min) ? {
            waveLateralSwing: window.__waveTrack.max - window.__waveTrack.min,
            wavePeakAboveShoulderY: window.__waveTrack.peakY,
          } : {}),
        },
      };
    };
    // calibration helper: slap a gesture's pose onto the bones right now
    window.rikoPreview = (name, t) => {
      if (!vrm) return;
      const pose = mirrorPose(sampleGesture(name, t), motion.vrm1);
      motion._applyPose(pose, 1, Object.keys(pose));
    };
    if (FORCE) {
      for (const item of String(FORCE).split(',')) {
        const [name, at = '0'] = item.trim().split('@');
        if (!GESTURES[name]) continue;
        setTimeout(() => motion.playGesture(name), Math.max(0, Number(at) || 0) * 1000);
      }
      // Per-frame tracker for the wave acceptance numbers (a 4-frame
      // snapshot cadence would miss the oscillation extremes):
      // lateral x swing of the right hand + peak height over the shoulder.
      window.__waveTrack = { min: Infinity, max: -Infinity, peakY: -Infinity };
      const _vp = new THREE.Vector3(), _vs = new THREE.Vector3();
      const trackWave = () => {
        const g = motion.gesture;
        // only inside the oscillation window (after the blend-in) so the
        // reported swing width is the wave itself, not the arm going up
        if (g && g.name === 'wave' && g.t > 0.5 && vrm) {
          const hb = vrm.humanoid.getNormalizedBoneNode('rightHand');
          const sb = vrm.humanoid.getNormalizedBoneNode('rightShoulder');
          if (hb && sb) {
            const p = hb.getWorldPosition(_vp), s = sb.getWorldPosition(_vs);
            const w = window.__waveTrack;
            w.min = Math.min(w.min, p.x); w.max = Math.max(w.max, p.x);
            w.peakY = Math.max(w.peakY, p.y - s.y);
          }
        }
        requestAnimationFrame(trackWave);
      };
      requestAnimationFrame(trackWave);
    }
    if (CAPTURE) {
      const wokeAt = performance.now();
      for (const s of String(CAPTURE).split(',').map(Number).filter((n) => n > 0)) {
        setTimeout(async () => {
          try {
            await new Promise((r) => requestAnimationFrame(r));  // a rendered frame in the buffer
            const t = ((performance.now() - wokeAt) / 1000).toFixed(2);
            await fetch(`/capture?t=${t}`, {
              method: 'POST', headers: { 'Content-Type': 'text/plain' },
              body: window.rikoCapture(),
            });
            await fetch(`/measure?t=${t}`, {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(window.rikoMeasure()),
            });
          } catch { /* harness gone; whatever it captured is captured */ }
        }, s * 1000);
      }
    }

    // ── Lip sync: band energies from the voice pick a vowel shape (aa/ih/ee/oh/ou) ──
    const voice = document.getElementById('voice');
    const audioCtx = new AudioContext();
    const analyser = audioCtx.createAnalyser();
    audioCtx.createMediaElementSource(voice).connect(analyser);
    analyser.connect(audioCtx.destination);
    analyser.fftSize = 1024;
    analyser.minDecibels = -90;
    analyser.maxDecibels = -10;
    const freqBytes = new Uint8Array(analyser.frequencyBinCount);
    const freqDb = new Float32Array(analyser.frequencyBinCount);

    function feedVowel() {
      analyser.getByteFrequencyData(freqBytes);
      for (let i = 0; i < freqBytes.length; i++) {
        freqDb[i] = analyser.minDecibels + (freqBytes[i] / 255) * (analyser.maxDecibels - analyser.minDecibels);
      }
      motion.setVowelTarget(vowelWeights(freqDb, audioCtx.sampleRate));
    }

    // ── Speech bubble, status pill, what she heard ──
    const bubble = document.getElementById('bubble');
    const heard = document.getElementById('heard');
    const status = document.getElementById('status');
    const approval = document.getElementById('approval');
    const timers = {};
    function flash(el, text, seconds, cls = '') {
      el.textContent = text;
      el.className = `show ${cls}`;
      clearTimeout(timers[el.id]);
      if (seconds) timers[el.id] = setTimeout(() => el.classList.remove('show'), seconds * 1000);
    }
    // Approval bubble: desktop.py emits 'approval' while a tool waits for an
    // answer; Enter says yes, Esc says no (a hub-side timeout denies anyway).
    let approvalOpen = false;
    function showApproval(summary, seconds) {
      approvalOpen = true;
      flash(approval, `Can I ${summary}?  Enter = yes, Esc = no`, 0);
    }
    function hideApproval(answered) {
      if (!approvalOpen) return;
      approvalOpen = false;
      approval.classList.remove('show');
      if (answered) flash(status, answered === 'yes' ? 'thank you :)' : 'ok, not then', 3);
    }
    const STATUS_TEXT = { listening: 'listening…', hearing: 'hmm?', thinking: 'thinking…' };
    function setStatus(state) {
      if (STATUS_TEXT[state]) flash(status, STATUS_TEXT[state], 0, state);
      else status.classList.remove('show');
      // she looks at you while she's with you: camera-lock on the social states
      motion.setGazeMode(state === 'listening' || state === 'hearing' || state === 'speaking' ? 'camera' : 'free');
    }

    // ── Text input ──
    const input = document.getElementById('input');
    const control = (cmd) => fetch(`/control/${cmd}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}',
    }).catch(() => {});
    // The W shortcut / riko-ctl 'wave': ask the director for a social wave.
    function requestWave() { feed(director.requestWave(T())); }
    function openInput() {
      input.classList.add('show');
      input.focus();
      control('input-opened');
    }
    function closeInput() {
      input.classList.remove('show');
      input.blur();
      control('input-closed');
    }
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { input.value = ''; closeInput(); }
      if (e.key === 'Enter' && !e.isComposing) {
        const text = input.value.trim();
        input.value = '';
        if (text) fetch('/say', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
        closeInput();
      }
      e.stopPropagation();
    });
    // ── In-window keyboard shortcuts ──
    // The keys come from /settings (desktop.shortcuts in character_config.yaml,
    // resolved by riko/shortcuts.py) as actions -> ["Ctrl+Shift+Backspace", ...].
    // They only fire while this window has focus, and never use Super/Meta —
    // that key belongs to the window manager. Escape and Enter inside the text
    // box are handled by the box itself, above.
    const SHORTCUTS = {};
    for (const [action, keys] of Object.entries(settings.shortcuts || {})) {
      const binds = [];
      for (const b of Array.isArray(keys) ? keys : [keys]) {
        if (typeof b !== 'string' || !b) continue;
        const parts = b.split('+');
        const key = parts.pop().toLowerCase();  // Python canonicalises, incl. 'Space'
        const mods = new Set(parts.map((m) => m.toLowerCase()));
        binds.push({ key, ctrl: mods.has('ctrl'), alt: mods.has('alt'), shift: mods.has('shift') });
      }
      SHORTCUTS[action] = binds;
    }
    const eventKey = (e) => (e.key === ' ' ? 'space' : String(e.key).toLowerCase());
    const matches = (e, b) =>
      eventKey(e) === b.key && !!e.ctrlKey === b.ctrl && !!e.altKey === b.alt && !!e.shiftKey === b.shift;
    const actionFor = (e) =>
      Object.keys(SHORTCUTS).find((a) => SHORTCUTS[a].some((b) => matches(e, b))) ?? null;

    // Push-to-talk is a real hold: the first keydown starts recording, the
    // matching keyup (or losing focus mid-hold) stops and sends.
    let talkHeld = false;
    const talkKeys = new Set((SHORTCUTS.talk || []).map((b) => b.key));
    function talkRelease() {
      if (!talkHeld) return;
      talkHeld = false;
      control('talk-stop');
    }
    let forgetArmedAt = 0;
    addEventListener('keydown', (e) => {
      if (!DESKTOP || e.target === input) return;  // the text box owns its own keys
      if (approvalOpen && (e.key === 'Enter' || e.key === 'Escape')) {
        e.preventDefault();  // the ask wins over the 'type' shortcut on Enter
        approvalAnswer(e.key === 'Enter');
        return;
      }
      if (e.key === 'Escape') { control('hide-input'); return; }
      if (e.repeat) return;
      const action = actionFor(e);
      if (!action) return;
      e.preventDefault();
      if (action === 'type') openInput();
      else if (action === 'talk') { talkHeld = true; control('talk-start'); }
      else if (action === 'wave') requestWave();
      else if (action === 'persona_next') control('persona-next');
      else if (action === 'hide') control('hide');
      else if (action === 'quit') control('quit');
      else if (action === 'forget') {
        // two presses within 3 s, so an accidental Ctrl+Shift+Backspace is not amnesia
        const now = Date.now();
        if (now - forgetArmedAt <= 3000) {
          forgetArmedAt = 0;
          status.classList.remove('show');
          control('forget');
        } else {
          forgetArmedAt = now;
          flash(status, 'Press again within 3 s to forget the chat', 3);
        }
      }
    });
    addEventListener('keyup', (e) => {
      if (talkHeld && talkKeys.has(eventKey(e))) talkRelease();  // modifiers ignored on release
    });
    addEventListener('blur', talkRelease);  // window lost focus mid-hold: send what we have

    function approvalAnswer(ok) {
      hideApproval(ok ? 'yes' : 'no');
      control(ok ? 'approve' : 'deny');
    }

    window.riko = { openInput, closeInput, requestWave, motion, director,
                    measure: () => window.rikoMeasure() };  // desktop.py calls these; motion/director/measure are for debugging, riko-ctl wave and the smoke test

    // ── Ask Python for her next line and UI events, tell it when a clip is done ──
    voice.onended = voice.onerror = () => fetch('/done', { method: 'POST' });

    function handle(ev) {
      if (ev.type === 'status') {
        setStatus(ev.state);
        feed(director.status(T(), ev.state));
      } else if (ev.type === 'say') {
        flash(bubble, ev.text, (ev.seconds || 0) + BUBBLE_SECONDS);
        feed(director.say(T(), { emotion: ev.emotion || 'neutral',
                                 seconds: ev.seconds || 0, text: ev.text || '' }));
      } else if (ev.type === 'heard') {
        flash(heard, ev.text, 6);
        feed(director.heard(T(), ev.text || ''));
      } else if (ev.type === 'error') {
        flash(bubble, ev.text, 6, 'error');
        feed(director.error(T()));
      } else if (ev.type === 'approval') {
        showApproval(ev.summary, ev.timeout_s);
      } else if (ev.type === 'approval_done') {
        hideApproval('');  // answered elsewhere (riko-ctl, or it timed out)
      } else if (ev.type === 'tool' && ev.phase === 'start') {
        flash(status, ev.label ? `using ${ev.label}` : 'using a tool…', 20, 'thinking');
      } else if (ev.type === 'open_input') openInput();
      else if (ev.type === 'close_input') closeInput();
      else if (ev.type === 'persona') {
        // Someone switched the persona (web page, riko-ctl, or she switched herself):
        // fetch her new body and swap without reloading; her greeting arrives as a 'say'.
        // Duplicated events for the SAME persona+version are ignored — the hub
        // poller (or a replay after a hub restart) must not re-load and re-wave.
        const key = `${ev.id}:${ev.avatar_version}`;
        if (key === attachedKey) return;
        loadVRM(`avatar.vrm?v=${encodeURIComponent(key)}`)
          .then((model) => {
            attach(model);          // motion re-targets gestures + expression on the new bones
            attachedKey = key;
            feed(director.persona(T(), ev));
          })
          .catch(() => location.reload());  // if her new body won't load, reload the page
      }
    }

    async function checkForVoice() {
      try {
        const { audio, events = [] } = await (await fetch('/next')).json();
        events.forEach(handle);
        if (audio) {
          voice.src = audio;
          await voice.play();
        }
      } catch { /* Python is not running; keep asking */ }
    }

    // Browsers only allow sound after a click, so wait for one. The desktop app allows it up front.
    const start = document.getElementById('start');
    function begin() {
      start.remove();
      audioCtx.resume();
      if (DESKTOP) console.log(`Riko page ready, viewport ${innerWidth}x${innerHeight}`);
      setInterval(checkForVoice, DESKTOP ? 150 : 250);
    }
    if (DESKTOP || CAPTURE) begin();  // capture mode: no click available in a headless run
    else {
      start.textContent = 'Click to start';
      start.onclick = begin;
    }

    // ── She follows the pointer inside her window (mouse only) ──
    addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse') motion.setPointer(e.clientX, e.clientY, true); });
    document.addEventListener('pointerleave', () => motion.setPointer(0, 0, false));

    // ── Every frame ──
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const dt = clock.getDelta();
      feed(director.tick(T()));  // idle gestures, gesture endings, expression decay
      feedVowel();
      motion.update(dt);
      vrm.update(dt);
      controls.update();  // runs the glide
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
