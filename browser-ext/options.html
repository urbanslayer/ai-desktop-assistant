<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Riko Helper</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 18px; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; }
    input, textarea { width: 100%; padding: 8px; font: inherit; box-sizing: border-box; }
    textarea { min-height: 90px; }
    button { margin-top: 14px; padding: 8px 14px; font: inherit; cursor: pointer; }
    #status { margin-top: 12px; padding: 8px 10px; border-radius: 8px; background: #f2eefc; }
    code { background: #f4f4f4; padding: 1px 5px; border-radius: 4px; }
    .hint { color: #666; font-size: 12.5px; }
  </style>
</head>
<body>
  <h1>Riko Helper</h1>

  <label for="token">Pairing token</label>
  <input id="token" type="password" autocomplete="off" placeholder="from riko-ctl browser-token (or her tray menu)">
  <p class="hint">Paste it once, here. It proves the local app on this PC is really hers.</p>

  <label for="port">App port</label>
  <input id="port" type="number" min="1" max="65535" value="8766">
  <p class="hint">ws://127.0.0.1:&lt;port&gt; — matches <code>desktop.client.browser_port</code> (default 8766).</p>

  <label for="allowlist">Allow list (one origin per line; empty = every site)</label>
  <textarea id="allowlist" placeholder="https://example.com&#10;https://wiki.example.org"></textarea>

  <button id="perm">Allow reading all sites</button>
  <p class="hint">Without it, Riko only sees tabs Firefox already gave her access to (the active one).</p>

  <button id="save">Save</button>
  <button id="pair" title="Fetch the token from the running Riko desktop">Auto-pair</button>
  <div id="status">…</div>

  <script src="options.js"></script>
</body>
</html>
